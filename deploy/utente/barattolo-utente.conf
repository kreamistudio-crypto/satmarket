; IL MERCATINO NON GIRA DA ROOT (set 2026, audit del 19 set: A1).
;
; E' un DROP-IN e non una unit nuova, apposta: si posa accanto a quella
; che c'e' (/etc/systemd/system/barattolo.service.d/utente.conf) senza
; toccarla, e TORNARE A ROOT SONO DUE COMANDI —
;     rm /etc/systemd/system/barattolo.service.d/utente.conf
;     systemctl daemon-reload && systemctl restart barattolo
; — perche' tutto quel che `barattolo` sa leggere e scrivere, root lo
; sa leggere e scrivere uguale. Lo posa `deploy/utente/cambio-utente.sh`,
; che aggiunge da se' la riga ExecStart quando quella di prima nomina
; /root.
;
; LA CARTELLA e' /srv/barattolo: dentro /root (che e' 700) un utente
; qualunque non entra. /root/satmarket resta come collegamento, quindi
; i comandi di PRODUZIONE e le unit di deploy e backup non cambiano.
;
; QUEL CHE QUI NON C'E', ED E' VOLUTO: NoNewPrivileges e i suoi parenti
; (ProtectKernel*, RestrictNamespaces, SystemCallFilter…), che con
; `User=` lo sottintendono. Il guardiano del ponte riavvia tor passando
; da sudo, e sudo con quel timbro addosso risponde «no new privileges»:
; il ponte cadrebbe senza piu' nessuno che lo rialzi. La strada che li
; sbloccherebbe e' una regola polkit al posto di sudoers — cantiere suo.

[Service]
User=barattolo
Group=barattolo
WorkingDirectory=/srv/barattolo
; le foto e il database che nascono da qui non li legge nessun altro
UMask=0027
