; IL RIAVVIO DOLCE (1 ott 2026, cantiere «I deploy non devono far cadere
; l'app»). Si posa ACCANTO a utente.conf, senza toccarlo:
;     /etc/systemd/system/barattolo.service.d/riavvio-dolce.conf
; e TORNARE INDIETRO SONO DUE COMANDI —
;     rm /etc/systemd/system/barattolo.service.d/riavvio-dolce.conf
;     systemctl daemon-reload
; — che valgono dal riavvio successivo, come la posa.
;
; PERCHE' DUE RIGHE. Caddy ora ASPETTA il backend per 30 secondi
; (lb_try_duration) invece di rispondere 502: il buco di un riavvio deve
; stare sotto quei 30. Di solito dura ~1,5 s; il 30 set alle 20:50 ne ha
; durati 90, perche' la lettura del connettore di AGORA girava in un
; filo che Python aspetta prima di uscire, e systemd l'ha ammazzato solo
; al suo tetto di serie (90 s, «stop-sigterm timed out»).
;   - TimeoutStopSec=20: il tetto dello spegnimento. Oltre, SIGKILL come
;     oggi — solo 70 secondi prima. 20 + ~1,5 di avvio stanno nei 30.
;   - UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN=10: quanto uvicorn aspetta le
;     richieste ancora aperte prima di chiudere. Passa dall'AMBIENTE e
;     non da ExecStart apposta: uvicorn legge ogni opzione anche come
;     UVICORN_<OPZIONE> (click, auto_envvar_prefix), cosi' la riga
;     ExecStart della unit resta una sola — e una variabile che un
;     uvicorn vecchio non conoscesse si ignora, mentre una flag
;     sconosciuta in ExecStart lo farebbe NON PARTIRE.
; La cura vera dei 90 secondi sta nel codice (il giro dei connettori si
; ferma allo spegnimento, `_SI_CHIUDE`); queste due righe sono la rete.

[Service]
TimeoutStopSec=20
Environment=UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN=10
