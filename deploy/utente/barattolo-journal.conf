; OGNI RIGA DEL SERVER ARRIVA SUBITO NEL JOURNAL (19 ott 2026, cantiere
; journal-senza-buffer, richiesta di Andrea). Si posa ACCANTO a
; utente.conf e riavvio-dolce.conf, senza toccarli:
;     /etc/systemd/system/barattolo.service.d/journal.conf
; e TORNARE INDIETRO SONO DUE COMANDI —
;     rm /etc/systemd/system/barattolo.service.d/journal.conf
;     systemctl daemon-reload
; — che valgono dal riavvio successivo, come la posa.
;
; PERCHE'. Sotto systemd lo stdout di Python non e' un terminale ma un
; tubo, e Python lo tiene in un buffer: una `print` senza `flush=True`
; resta li' finche' il buffer non si riempie o qualcuno non lo svuota.
; Il 15-17 ott le righe «⚠️ … saltato: 'sqlite3.Row' object has no
; attribute 'get'» di promo_venduto e promo_rimuovi sono scattate e il
; journal non le ha MAI mostrate: si sono perse ai riavvii (Cantieri,
; «Il ✅ Venduto e il ritiro dei post»). Quelle due ora hanno
; `flush=True`; questa riga vale per TUTTE le altre, senza toccarle una
; a una. Passa dall'AMBIENTE e non da `python -u` in ExecStart per la
; ragione di riavvio-dolce.conf: la riga ExecStart della unit resta una
; sola, e un drop-in si toglie senza toccarla.
; Il prezzo: una scrittura per riga invece di una ogni tanto. Il server
; stampa poche righe al minuto, e journald le regge senza accorgersene.

[Service]
Environment=PYTHONUNBUFFERED=1
