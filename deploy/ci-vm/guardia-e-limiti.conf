# LA GUARDIA E I TETTI DEL RUNNER DELLA VM-2050 (ott 2026, cantiere
# runner-vm, decisioni di Andrea). Sulla VM:
# /etc/systemd/system/ci-runner-vm-2050.service.d/guardia-e-limiti.conf,
# root:root 644: `ci` non lo puo' cambiare.
[Service]
# La guardia, prima di ogni job (deploy/ci-vm/solo-main.sh). Sta QUI e
# non nel .env del runner: il runner legge il .env all'avvio e ogni sua
# riga vince sull'ambiente di systemd — una riga vuota cancellerebbe
# questa. Per questo il .env sulla VM e' di root e immutabile
# (chattr +i): la cartella e' di `ci`, e senza +i potrebbe cancellarlo
# e rifarlo.
Environment=ACTIONS_RUNNER_HOOK_JOB_STARTED=/opt/ci-guardia/solo-main.sh

# Il collaudo resta il primo della VM (3,8 GB, 2 vCPU, 2 GB di swap):
# sopra 2 GB il runner viene frenato, a 2,5 GB il job muore (e la CI e'
# rossa, cioe' lo si vede); al piu' 1 GB di swap, il resto e' del
# collaudo. Processore e disco in seconda fila.
MemoryHigh=2G
MemoryMax=2560M
MemorySwapMax=1G
CPUWeight=50
IOWeight=50
Nice=5

# Le cartelle del collaudo non esistono nemmeno, per il runner: oltre ai
# permessi (provati: «Permission denied»), un secondo lucchetto che vale
# anche per i file che nasceranno dopo. Il «-» le salta se mancano.
# /tmp suo, e nessun modo di guadagnare privilegi.
InaccessiblePaths=-/etc/barattolo-collaudo -/srv/collaudo -/home/collaudo -/home/debian
PrivateTmp=yes
NoNewPrivileges=yes
