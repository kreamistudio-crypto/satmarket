# wg-quick-dopo-docker.conf - NODO: diventa
# /etc/systemd/system/wg-quick@wg0.service.d/dopo-docker.conf (644, root)
# IL TUNNEL PARTE DOPO DOCKER (2 nov 2026). E' un drop-in e non una unit
# riscritta: la wg-quick@.service del pacchetto resta com'e', e per
# tornare indietro basta togliere questo file e fare daemon-reload.
#
# PERCHE'. Fra i PostUp di wg0-nodo.conf c'e' la riga in DOCKER-USER, e
# quella catena la crea Docker quando parte. Al riavvio del nodo del
# 1 nov 2026 (il kernel della CVE) il tunnel e' salito alle 17:51:30 e
# Docker alle 17:51:33: la catena non c'era, l'inserimento e' fallito
# («No chain») e il suo `|| true` - che serve sulle macchine SENZA
# Docker - l'ha lasciato correre. Docker poi ha creato DOCKER-USER
# vuota, e i due DROP di FORWARD sono rimasti sotto le sue regole per
# 16 ore, fino al giro lungo della ronda-superficie del mattino dopo.
#
# After= e non Requires=: decide solo l'ORDINE. Se Docker non parte, il
# tunnel sale lo stesso (senza Docker non c'e' niente da inoltrare);
# e un restart di Docker non tocca il tunnel, ne' la riga: DOCKER-USER
# e' la catena che Docker non svuota mai.
[Unit]
After=docker.service
