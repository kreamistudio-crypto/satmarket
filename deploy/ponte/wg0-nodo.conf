# wg0-nodo.conf - NODO: diventa /etc/wireguard/wg0.conf (600, root)
# IL CAPO "SERVER" DEL TUNNEL (21 set 2026): il nodo ASCOLTA sulla
# 51820/udp, il VPS chiama. Una sola peer: il VPS di Barattolo.
#
# LA CHIAVE PRIVATA NON STA IN QUESTO FILE, apposta: nasce sul nodo
# (`wg genkey`) in /etc/wireguard/privata.key e la carica il PostUp.
# Cosi' questo file si puo' copiare, confrontare con lo sha256 e tenere
# nel repo: dentro c'e' solo la chiave PUBBLICA dell'altro capo.
#
# IL FIREWALL VIVE QUI, nei PostUp, e non in ufw/nftables: le regole
# nascono col tunnel e muoiono con lui, nello stesso gesto (la lezione
# del 15 set: regole tenute da un altro processo restano indietro in
# silenzio). Se una regola non entra, wg-quick si FERMA e smonta
# l'interfaccia: fail-closed, il tunnel senza firewall non esiste.
#   catena WG-PONTE, agganciata in cima a INPUT:
#   1. dal tunnel, dal solo 10.77.0.2, verso la sola 18080/tcp: passa
#   2. qualunque altra cosa arrivi dal tunnel: via
#   3. qualunque cosa cerchi 10.77.0.1 da un'ALTRA interfaccia: via
#      (Linux risponde per ogni suo indirizzo su ogni interfaccia: senza
#      questa, un vicino di rete potrebbe bussare a 10.77.0.1 da eth0)
#   4-5. la porta del tunnel risponde al solo IP del VPS
#   FORWARD: niente entra ne' esce dal tunnel verso altre reti. E' LA
#   RIGA CHE CONTA: l'host ha ip_forward=1 (lo vuole Docker), e senza di
#   lei chi prendesse il VPS potrebbe farsi inoltrare verso i container
#   (bitcoind, il gRPC di LND, mostro). Con lei arriva alla sola REST,
#   coi macaroon che aveva gia'.
[Interface]
Address = 10.77.0.1/32
ListenPort = 51820
PostUp = iptables -w -N WG-PONTE 2>/dev/null || iptables -w -F WG-PONTE
PostUp = iptables -w -A WG-PONTE -i %i -s 10.77.0.2 -d 10.77.0.1 -p tcp --dport 18080 -j ACCEPT
PostUp = iptables -w -A WG-PONTE -i %i -j DROP
PostUp = iptables -w -A WG-PONTE -d 10.77.0.1 -j DROP
PostUp = iptables -w -A WG-PONTE -p udp --dport 51820 -s 46.62.162.103 -j ACCEPT
PostUp = iptables -w -A WG-PONTE -p udp --dport 51820 -j DROP
PostUp = iptables -w -C INPUT -j WG-PONTE 2>/dev/null || iptables -w -I INPUT 1 -j WG-PONTE
PostUp = iptables -w -C FORWARD -i %i -j DROP 2>/dev/null || iptables -w -I FORWARD 1 -i %i -j DROP
PostUp = iptables -w -C FORWARD -o %i -j DROP 2>/dev/null || iptables -w -I FORWARD 1 -o %i -j DROP
# ...e la stessa riga in DOCKER-USER: a ogni suo riavvio Docker si
# rimette IN CIMA a FORWARD, e le due righe qui sopra scivolano sotto
# le sue. DOCKER-USER e' la catena che Docker guarda per prima e non
# tocca mai. (|| true: su una macchina senza Docker la catena non c'e')
PostUp = iptables -w -C DOCKER-USER -i %i -j DROP 2>/dev/null || iptables -w -I DOCKER-USER 1 -i %i -j DROP || true
PostUp = ip6tables -w -C INPUT -p udp --dport 51820 -j DROP 2>/dev/null || ip6tables -w -I INPUT 1 -p udp --dport 51820 -j DROP || true
# LA CHIAVE PER ULTIMA: finche' non c'e', il tunnel non puo' portare
# nemmeno un pacchetto - quindi non esiste un istante col tunnel vivo
# e il firewall non ancora montato.
PostUp = wg set %i private-key /etc/wireguard/privata.key
PreDown = iptables -w -D INPUT -j WG-PONTE || true
PreDown = iptables -w -D FORWARD -i %i -j DROP || true
PreDown = iptables -w -D FORWARD -o %i -j DROP || true
PreDown = iptables -w -D DOCKER-USER -i %i -j DROP || true
PreDown = iptables -w -F WG-PONTE || true
PreDown = iptables -w -X WG-PONTE || true
PreDown = ip6tables -w -D INPUT -p udp --dport 51820 -j DROP || true

[Peer]
# il VPS di Barattolo
PublicKey = INCOLLA_QUI_LA_PUBBLICA_DEL_VPS
AllowedIPs = 10.77.0.2/32
