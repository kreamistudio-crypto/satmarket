# wg0-vps.conf - VPS di Barattolo: diventa /etc/wireguard/wg0.conf (600)
# IL CAPO "CLIENT" DEL TUNNEL (21 set 2026): il VPS chiama il nodo, e
# non ascolta su nessuna porta - quindi in ufw non si apre NIENTE (le
# risposte rientrano da sole, e `deny incoming` vale anche su wg0: dal
# tunnel verso il VPS non entra nessuna connessione nuova).
# PersistentKeepalive: un pacchetto ogni 25 s tiene aperta la strada di
# ritorno nei firewall a stati che stanno in mezzo (ufw compreso).
# AllowedIPs e' UN indirizzo: nel tunnel entra solo il traffico verso
# 10.77.0.1, tutto il resto del VPS esce da dove usciva.
#
# LA CHIAVE PRIVATA NON STA IN QUESTO FILE: nasce sul VPS (`wg genkey`)
# in /etc/wireguard/privata.key e la carica il PostUp. Qui dentro c'e'
# solo la chiave PUBBLICA del nodo.
[Interface]
Address = 10.77.0.2/32
PostUp = wg set %i private-key /etc/wireguard/privata.key

[Peer]
# il nodo (LNVPS, Dublino)
PublicKey = INCOLLA_QUI_LA_PUBBLICA_DEL_NODO
Endpoint = 185.18.221.96:51820
AllowedIPs = 10.77.0.1/32
PersistentKeepalive = 25
