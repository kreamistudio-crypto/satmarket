# nodo-ronda.timer, OGNI ORA (28 set 2026). Prima: il lunedi' alle 9 UTC.
# E' un drop-in e non una unit riscritta: la unit vera resta com'e', e
# per tornare indietro basta togliere questo file (vedi PRODUZIONE, «LA
# RONDA DEL NODO OGNI ORA»). La riga vuota AZZERA l'OnCalendar della
# unit: senza, systemd li terrebbe tutt'e due.
# Al minuto 5 e non allo 0: lontano dai timer che scattano all'ora
# tonda. Il giro lungo lo decide ronda.sh (il primo dalle 9 UTC).
[Timer]
OnCalendar=
OnCalendar=*-*-* *:05:00
Persistent=true
