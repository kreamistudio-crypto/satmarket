# Lo specchio del libro ordini P2P (set 2026).
#
# Tiene una copia dei 38383 (gli ordini) e del 38385 (le impostazioni)
# che il NOSTRO coordinator Mostro pubblica sui relay pubblici, cosi'
# il libro si legge anche da relay.barattolo.store.
#
# ⚠️ NON E' UNA PORTA APERTA, ed e' il filtro a dirlo, non le
# intenzioni: si scaricano tre kind soli (due fino al 17 set 2026: il 14
# ha la sua voce accanto al filtro), da UN autore solo. Chiunque
# altro pubblichi un 38383 su damus, da noi non arriva.
#
# ⚠️ E LA CORRENTE E' A SENSO UNICO (`dir = "down"`): da qui non esce
# niente verso i relay del coordinator. Non e' prudenza generica —
# all'insu' questo processo diventerebbe un modo per far uscire dal
# nostro relay roba che nessuno ha chiesto di pubblicare.
#
# PERCHE' IL ROUTER E NON `strfry sync` A TIMER: il router tiene una
# sottoscrizione VIVA, quindi il ritardo e' di secondi. Con un timer
# sarebbe l'intervallo del timer, e su questo libro il ritardo si
# paga caro: un ordine che passa da `pending` a preso e' una
# SOSTITUZIONE, non una cancellazione — uno specchio indietro lo
# mostra ancora disponibile, e chi prova a prenderlo si becca un
# errore che non sa spiegarsi.
#
# LA WHITELIST NON C'ENTRA, ed e' verificato (set 2026): il plugin
# `chi-scrive.py` lo invoca l'ingester del processo `strfry relay`,
# mentre il router e' un ALTRO processo che apre l'LMDB e ci scrive
# dentro. La conferma sta nel binario di strfry 1.1.3, che porta sia
# `pluginDown` sia `pluginUp`: se il writePolicy del relay coprisse
# gia' questa strada, quelle due opzioni sarebbero ridondanti.
# Quindi la chiave del coordinator NON entra in `chiavi.txt`, e non
# deve entrarci: quella lista e' di chi ci scrive DA FUORI.
#
# E NIENTE `pluginDown` QUI: il filtro e' gia' il cancello, e un
# secondo cancello che dice la stessa cosa e' solo un posto in piu'
# dove sbagliare.

connectionTimeout = 20

streams {
    # L'autore e' la chiave PUBBLICA del nostro coordinator: la stessa
    # `MOSTRO_NPUB` del config di Barattolo, in esadecimale perche' i
    # filtri Nostr non parlano bech32. E' pubblica per mestiere — firma
    # il libro ordini che tutti leggono — ma lo scanner della CI vede
    # 64 esadecimali e non sa distinguere: per questo il file e' nella
    # lista delle eccezioni di `prove.yml`, per NOME e mai per cartella.
    mostro {
        dir = "down"

        urls = [
            "wss://relay.mostro.network",
            "wss://relay.damus.io",
            "wss://nos.lol",
        ]

        # IL 14 (17 set 2026, le notifiche istantanee): le BUSTE che il
        # coordinator manda a chi scambia — cifrate, e gia' pubbliche
        # sui tre relay qui sopra. Da qui il server di Barattolo le
        # sente arrivare (un ascolto permanente su QUESTO relay) e
        # suona il campanello subito invece che al giro del minuto.
        # Resta UN autore solo: la chat fra le due parti — kind 14
        # anche lei, ma firmata dalle trade key — da qui NON passa.
        # Il contenuto non lo apre nessuno: la chiave sta nel telefono.
        filter = { "kinds": [38383, 38385, 14], "authors": ["afe3de9aa8616d7c2e62eb336d3a127cf9daa9b4482ab1e9361d5c175d3b8cf3"] }
    }
}
