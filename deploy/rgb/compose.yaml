# rgb-prova: bitcoind signet + electrs + proxy RGB.
# Le stesse immagini con cui rgb-lib fa le sue prove (registro hashbeam).
# Nessuna porta su 0.0.0.0: docker scavalca ufw, quindi solo 127.0.0.1.
services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:30.2
    restart: unless-stopped
    environment:
      NETWORK: signet
      RPCAUTH: ${RPCAUTH}
      BTCUSER: ${BTCUSER}
      BTCPASS: ${BTCPASS}
    volumes:
      - bitcoind-dati:/srv/app/.bitcoin
    healthcheck:
      test: ["CMD", "su", "-c", "bitcoin-cli -signet getblockchaininfo", "blits"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 120s

  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.11.0
    restart: unless-stopped
    depends_on:
      - bitcoind
    environment:
      NETWORK: signet
      BTCHOST: bitcoind
      BTCRPCPORT: "38332"
      BTCP2PPORT: "38333"
      BTCUSER: ${BTCUSER}
      BTCPASS: ${BTCPASS}
    ports:
      - "127.0.0.1:50001:50001"
    volumes:
      - electrs-db:/srv/app/db

  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - proxy-dati:/home/node/.rgb-proxy-server

volumes:
  bitcoind-dati:
  electrs-db:
  proxy-dati:
