<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barattolo — sei senza rete</title>
<!-- Fuori dall'indice, e scritto qui a mano: questa pagina NON passa
     da _pagina_con_meta (e' un file suo, servito tale e quale), quindi
     il noindex delle altre non la copre. Un «sei senza rete» fra i
     risultati di ricerca sarebbe la peggiore prima impressione
     possibile. Deve restare CRAWLABILE — non si vieta in robots.txt
     cio' che si vuole deindicizzare, o il noindex non lo legge mai
     nessuno. -->
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#FAF4E4">
<style>
  /* Pagina di cortesia servita dal service worker a rete morta.
     Autonoma per scelta: font di SISTEMA, la mascotte dalla dispensa
     del SW. Dall'ago 2026 i font del brand stanno in casa e sono in
     dispensa anche loro, quindi qui si potrebbero usare — non lo
     facciamo: questa pagina si vede quando tutto il resto e' rotto, e
     una pagina d'emergenza che non dipende da nessun altro file e'
     meglio di una piu' bella. */
  body{margin:0;min-height:100vh;display:flex;align-items:center;
       justify-content:center;background:#FAF4E4;color:#23282C;
       font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
       text-align:center;padding:24px;box-sizing:border-box}
  img{width:160px;height:160px;border-radius:24px;display:block;
      margin:0 auto 18px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 22px;opacity:.75}
  button{font:inherit;font-weight:700;color:#fff;background:#F7931A;
         border:none;border-radius:999px;padding:12px 28px;
         box-shadow:0 3px 0 #c9760f;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:none}
  @media (prefers-reduced-motion: no-preference){
    img{animation:fluttua 3s ease-in-out infinite}
    @keyframes fluttua{50%{transform:translateY(-8px)}}
  }
  @media (prefers-color-scheme: dark){
    body{background:#211A10;color:#FAF4E4}
  }
</style>
</head>
<body>
<main>
  <img src="/assets/mascotte.jpeg" alt="La mascotte di Barattolo"
       onerror="this.style.display='none'">
  <h1>🫙 Sei senza rete</h1>
  <p>Il barattolo ti aspetta: appena torna la rete riprovo da solo.</p>
  <button onclick="location.reload()">Riprova</button>
</main>
<script>
/* RIPROVA DA SOLA (19 ott 2026, cantiere logout-apk, richiesta di
   Andrea): prima restava qui finche' non si toccava «Riprova», anche a
   rete tornata da un pezzo. Ora ricarica da sola in due casi: il
   telefono dice che la rete e' tornata (l'evento `online`), oppure il
   server risponde di nuovo — che e' il caso del deploy, dove la rete
   non e' mai mancata e `online` non arriva. La bussata e' leggera e
   rada: /api/salute (il service worker le API non le tocca mai), ogni
   ATTESA_MS, solo a pagina in vista. Il server «c'e'» se risponde
   qualcosa che non e' il 502/503/504 di Caddy col backend spento —
   le risposte dell'app sono JSON anche quando dicono «non sto bene». */
var ATTESA_MS = 5000;
var ricaricata = false;
function serverTornato(r){
  if (!r) return false;
  var tipo = (r.headers && r.headers.get && r.headers.get('content-type')) || '';
  return r.status < 500 || /json/i.test(tipo);
}
function ricarica(){
  if (ricaricata) return;
  ricaricata = true;
  location.reload();
}
function bussa(){
  if (ricaricata || document.visibilityState !== 'visible') return;
  fetch('/api/salute', {cache: 'no-store'})
    .then(function(r){ if (serverTornato(r)) ricarica(); })
    .catch(function(){});
}
window.addEventListener('online', ricarica);
document.addEventListener('visibilitychange', bussa);
setInterval(bussa, ATTESA_MS);
</script>
</body>
</html>
