# La rete di sicurezza di Barattolo, a ogni commit e a ogni PR.
#
# Gira SOLO cio' che non ha bisogno di segreti: niente config.py,
# niente database, niente chiamate ai relay o ad Anthropic. Una CI
# che dipende da un server altrui fallisce quando quello ha il
# raffreddore, e a furia di rossi ingiusti si smette di guardarla.
name: prove

on:
  push:
  pull_request:

jobs:
  prove:
    # La CI legge e basta: compila, prova, guarda. Non commenta, non
    # committa, non pubblica niente. Dirlo qui vuol dire che il token
    # del workflow resta in sola lettura anche se un domani il default
    # del repo diventasse piu' largo.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Solo quelle che servono ALLE PROVE: websocket-client perche'
      # importa_nostr la importa in cima, Pillow per il controllo del
      # pareggio delle illustrazioni, e cryptography per la cifratura
      # dei contenuti digitali (ago 2026 — e a dirlo e' stato
      # PROVE_SEVERE: la prova nuova si e' saltata da sola e il job e'
      # diventato rosso invece di passare con una prova in meno. E' il
      # meccanismo del giro prima che prende il giro dopo).
      #
      # Pillow qui non c'e' mai stata, e questo commento diceva a
      # chiare lettere che era voluto: il risultato e' che quella prova
      # in CI non e' MAI girata — si saltava da sola, in silenzio, e in
      # locale passava perche' in locale Pillow c'e'. Misurato: 211
      # prove invece di 212. Coincurve, anthropic & co. restano fuori
      # per davvero: i pezzi che le usano sono fail-open per
      # costruzione e qui non si esercitano — il badge Nostr NIP-58
      # (set 2026) lo conferma invece di romperlo: il suo giudice della
      # firma vera esisteva nella prima stesura, chiedeva coincurve per
      # davvero, ed e' sparito insieme al meccanismo che lo usava
      # (niente piu' challenge da verificare sui relay — vedi
      # docs/CANTIERI.md, "IL SECONDO GIRO"). Quel che resta si prova
      # con un doppio, come sempre qui.
      - name: Installa il minimo indispensabile
        run: pip install --quiet websocket-client pillow cryptography snowballstemmer

      # Primo scalino: tutto compila. Banale e imbattibile — becca il
      # refuso prima che arrivi sul VPS, che e' esattamente il modo
      # in cui il mercatino potrebbe restare giu' per una virgola.
      - name: Tutto compila
        run: python -m compileall -q server.py importa_nostr.py prove.py
             genera_icone.py genera_icone_apk.py censimento_nostr.py
             censimento_spedizione.py censimento_payout.py capitale_cassa.py orfani.py
             censimento_scadenze.py collaudo_fatture_scadute.py
             collaudo_rotte_metodi.py
             collaudo_in_pagamento.py collaudo_altra_cassaforte.py
             collaudo_chiusura_saas.py
             ripulisci_anello_nostr.py
             ricategorizza.py sposta_a_mano.py ritaglia_categorie.py
             presenta_release.py config_esempio.py prova_notifica.py
             importa_negozio.py collaudo_connettori.py
             og_categorie.py
             assegna_sottocategorie.py ripulisci_avatar_min.py
             anteprime.py collaudo_impersonazione.py
             stima_coda_moderazione.py recupera_cambi_ordini.py
             converti_soglie_euro.py collaudo_conto.py
             converti_soglie_euro.py recupera_cambi_ordini.py
             stima_coda_moderazione.py collaudo_altri_oggetti.py
             collaudo_reti.py collaudo_nota.py collaudo_porta_timer.py
             collaudo_feedback_confermato.py ripubblica_tag_client.py
             collaudo_recensione_p2p.py collaudo_pagamento_p2p.py
             collaudo_avvisi_in_ordine_p2p.py
             collaudo_paycode_riconosciuto.py
             collaudo_pausa.py collaudo_due_teste.py
             collaudo_consegna_firmata.py collaudo_ricategorizza.py
             collaudo_ricerca.py collaudo_sblocco_banner.py collaudo_servizio_dove.py
             anteprima_riepilogo.py
             collaudo_finestra.py collaudo_rilancio.py
             confronta_vetrina.py
             collaudo_busta_diretta.py
             collaudo_email_corriere.py collaudo_account.py
             collaudo_duplicato.py
             collaudo_punto_concordato.py collaudo_lnbits_muto.py
             classifica_prova.py collaudo_classifica.py
             marca_prove.py recupera_xp_ordini.py livelli_prova.py
             collaudo_inviti.py
             collaudo_offerta_carrello.py collaudo_punti_barattolo.py
             spoglia_foto_esistenti.py collaudo_verita_lnd.py
             giudice_deploy.py collaudi_ci.py
             racconti.py collaudo_racconti_bozza.py collaudo_sponsor.py
             collaudo_letture_relay.py
             prepara_logo_consigliato.py
             collaudo_spedizione_standard.py
             collaudo_catalogo_esterno.py
             collaudo_carrelli_unico.py
             collaudo_nuova_fattura.py

      # Secondo scalino: il config d'esempio deve restare allineato,
      # perche' e' quello da cui Andrea copia quando mette mano al VPS.
      - name: Il config d'esempio e' leggibile
        run: python -c "import ast,sys; ast.parse(open('config_esempio.py',
             encoding='utf-8').read())"

      # Terzo scalino: le prove vere.
      #
      # PROVE_SEVERE e' la cintura del passo qui sopra: aggiungere
      # Pillow ripara oggi, questa riga ripara il giorno che qualcuno
      # la toglie. Qui le dipendenze si installano apposta, quindi una
      # prova che si salta vuol dire che qualcosa e' andato storto e
      # la CI deve diventare rossa. In locale, dove chi non ha Pillow
      # deve poter girare le prove lo stesso, la variabile non c'e' e
      # la saltata resta un avviso contato.
      - name: Le prove
        env:
          PROVE_SEVERE: "1"
        run: python prove.py

      # Quarto scalino (22 set 2026): i COLLAUDI, cioe' il server vero
      # su un database usa-e-getta. `prove.py` guarda i pezzi estratti;
      # qui si accorge di una colonna che manca o di un doppio con la
      # firma vecchia — `collaudo_feedback_confermato` e' rimasto rosso
      # tre giorni per il `riga=` di `paga_venditore` perche' non lo
      # girava nessuno.
      #
      # LE DIPENDENZE DEL SERVER SI INSTALLANO QUI, DOPO LE PROVE, e
      # non nello scalino di sopra: `prove.py` gira apposta senza
      # httpx ne' fastapi (vedi collaudo_verita_lnd.py), e allargargli
      # l'ambiente cambierebbe cosa prova senza che nessuno lo decida.
      #
      # L'ELENCO E' SCRITTO A MANO, uno per nome, e non e' un glob:
      # entra solo un collaudo GUARDATO — config di cartone installato
      # prima dell'import del server, niente rete, stesso esito a ogni
      # giro. «Niente rete» non si prende sulla parola: `collaudi_ci.py`
      # gira ognuno in una gabbia che ferma ogni connessione fuori da
      # 127.0.0.1 e fa rosso chi ci prova (il perche' sta li').
      #
      # `!cancelled()` e non il default: i collaudi parlano anche se le
      # prove sono rosse — la lezione del job dei segreti, un rosso
      # prima non deve zittire le domande dopo. Il job resta rosso lo
      # stesso, e con lui il semaforo del deploy.
      - name: Le dipendenze del server, per i collaudi
        if: ${{ !cancelled() }}
        run: pip install --quiet fastapi httpx anthropic

      - name: I collaudi, senza rete
        if: ${{ !cancelled() }}
        run: python collaudi_ci.py
             collaudo_porta_timer
             collaudo_sblocco_banner
             collaudo_feedback_confermato
             collaudo_verita_lnd
             collaudo_altra_cassaforte
             collaudo_chiusura_saas
             collaudo_carrelli_unico
             collaudo_in_pagamento
             collaudo_lnbits_muto
             collaudo_fatture_scadute
             collaudo_rotte_metodi
             collaudo_pagamento_p2p
             collaudo_avvisi_in_ordine_p2p
             collaudo_paycode_riconosciuto
             collaudo_racconti_bozza
             collaudo_sponsor
             collaudo_inviti
             collaudo_letture_relay
             collaudo_spedizione_standard
             collaudo_catalogo_esterno
             collaudo_nuova_fattura
             collaudo_classifica

  # La regola ferrea numero 1, e vive in un JOB SUO — non in coda
  # all'altro, ed e' il pezzo da non rimettere com'era.
  #
  # Da passo finale era l'ULTIMO della fila: qualunque cosa fallisse
  # prima lo nascondeva, e non diceva "pulito" a torto — non parlava
  # proprio. E' successo per davvero: le prove si sono rotte alle 13:20
  # del 3 ago 2026 e per 13 push di fila i segreti non li ha guardati
  # nessuno, mentre la pagina di GitHub diceva soltanto "rosso".
  # Cosi' invece i due job partono insieme e si rispondono da soli: le
  # prove possono rompersi quanto vogliono, il controllo dei segreti
  # parla lo stesso. Non serve nemmeno Python — sono git e grep.
  segreti:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # Le forme dei segreti, scritte UNA volta: le guardano sia i file
      # di oggi sia la cronologia, e due elenchi che divergono sarebbero
      # peggio di uno solo.
      #
      # Le tre di sempre (nsec, token del bot, chiave Anthropic) hanno
      # una forma loro. Le altre no — la invoice key di LNbits e' 32
      # esadecimali, che da soli somigliano a mezzo mondo — quindi si
      # ancorano al NOME della variabile, cioe' al nome seguito da un
      # uguale e da una stringa non vuota. (L'esempio non si scrive per
      # esteso qui dentro: la regola lo prenderebbe, e questo file lo
      # legge anche lei.)
      # E' anche una regola che si estende da sola, perche' vale per
      # qualunque segreto futuro che rispetti la convenzione dei
      # segnaposto INCOLLA_QUI di config_esempio.py.
      #
      # E LE CREDENZIALI DEI NEGOZI COLLEGATI (ago 2026, coi
      # connettori): quelle una forma ce l'hanno — `ck_` e `cs_` di
      # WooCommerce seguiti da 40 esadecimali, e i token di Shopify,
      # che cominciano per `shpat_` (app privata), `shpca_`, `shppa_`
      # o `shpss_` — e non un nome, perche' non stanno nel config:
      # vivono cifrate nel database, e nel repo non devono entrare in
      # nessun modo. Sono i primi segreti del progetto che non passano
      # da config_esempio.py, ed e' per questo che si riconoscono
      # dalla FORMA come la nsec e la chiave Anthropic.
      # Le lunghezze sono LARGHE in coda (`{32,}`, `{40,}`) come per
      # il token del bot: meglio un falso allarme da guardare che un
      # segreto vero che passa perche' il formato e' cambiato di un
      # carattere.
      # E la chiave age dei backup (AGE-SECRET-KEY-1...): la meta'
      # segreta vive su carta + Bitwarden e non deve mai entrare nel
      # repo — nel repo sta solo la PUBBLICA, che sa cifrare e basta.
      FORME: >-
        nsec1[0-9a-z]{50,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|nostr\+walletconnect://[A-Za-z0-9._~:/?#@!$&*+,;=%-]{20,}|(LNBITS_INVOICE_KEY|LNBITS_ADMIN_KEY|LNBITS_NODO_INVOICE_KEY|LNBITS_NODO_ADMIN_KEY|TELEGRAM_WEBHOOK_SEGRETO|CHIAVE_CONTENUTI_DIGITALI|P2P_SCONTO_SEGRETO|LND_PONTE_MACAROON_LETTURA|SEGRETI_PROFILO_P2P)[[:space:]]*=[[:space:]]*['"][^'"]|\b(ck|cs)_[0-9a-f]{40,}|\bshp(at|ca|pa|ss)_[0-9a-f]{32,}|AGE-SECRET-KEY-1[0-9A-Z]{40,}
      # E la chiave Nostr in esadecimale nudo, che ha una regola sua
      # perche' ha un'eccezione sua: vendor/nostr.bundle.js ne contiene
      # per mestiere. Sta qui, accanto a FORME, per la stessa ragione
      # di FORME — la guardano in due, e due copie divergono.
      # I SEGNAPOSTI: quel che NON e' un segreto pur avendone la
      # forma. `INCOLLA_QUI` e' il config d'esempio; il secondo e' la
      # chiave di cartone dei BANCHI, che per costruire un modulo
      # `config` finto puo' capitare scrivano `NOME = "valore"` — la
      # forma di un file di configurazione, che questa regola cerca
      # apposta e non sa distinguere da una chiave vera.
      # ⚠️ Stanno QUI e non a mano nei due passi, o divergono: e'
      # gia' successo alle FORME. E si esclude il VALORE e mai il
      # file: un collaudo che un domani portasse una chiave vera
      # resterebbe preso.
      # IL TERZO E' UNA LETTERA E UNA CIFRA (set 2026), e serve alla
      # CRONOLOGIA: dc794b3 ha spinto quattro righe di cartone nella
      # forma `KEY="i1"` prima che il banco passasse al dizionario,
      # e la storia non si riscrive. Nessuna chiave vera ha quella
      # forma, quindi l'eccezione non copre nessun segreto. L'albero
      # e' pulito anche SENZA di lui (provato in locale sui due passi).
      # Il quarto (17 set 2026): `SEGRETO = "..."`, tre puntini veri —
      # la riga d'esempio di PRODUZIONE finita nella cronologia il
      # giorno stesso in cui P2P_SCONTO_SEGRETO e' entrato fra le
      # FORME. Tre punti non sono la forma di nessuna chiave.
      SEGNAPOSTI: INCOLLA_QUI|collaudo-usa-e-getta|KEY *= *"[a-z][0-9]"|SEGRETO *= *"\.\.\."
      # LE CHIAVI DI CARTONE IN ESADECIMALE: 64 volte LO STESSO
      # carattere (i test Rust della patch 0005 ne avevano due, e sono
      # nella cronologia). Si TOGLIE IL VALORE dalla riga prima di
      # guardarla, non la riga: una chiave vera accanto a una di
      # cartone resta li' e fa scattare la regola.
      # E DUE VALORI PUBBLICI (24 set 2026): gli sha256 dei due PNG
      # originali dei loghi dei tondi, scritti interi nel primo commit
      # di assets/loghi/LEGGIMI.md (8adea78) — impronte di file
      # pubblici, non chiavi, e la storia non si riscrive. Si tolgono
      # per VALORE, mai il file: una chiave vera incollata domani in
      # quel LEGGIMI fa scattare la regola come ovunque. Sono scritti
      # come prefisso di 16 + [0-9a-f]{48} perche' questo file non
      # contenga a sua volta sessantaquattro esadecimali di fila; oggi
      # nel LEGGIMI stanno a gruppi di otto, e l'albero e' pulito anche
      # SENZA questa eccezione (provato in locale sui due passi).
      CARTONE_HEX: 's/\b([0-9a-f])\1{63}\b//g;s/\bf91e9d7c30894cb0[0-9a-f]{48}\b//g;s/\b85d68c6972360099[0-9a-f]{48}\b//g'
      FORMA_HEX: '\b[0-9a-f]{64}\b'
    steps:
      - uses: actions/checkout@v5
        with:
          # Serve la cronologia INTERA (di serie il checkout e' shallow
          # e nel runner non c'e' proprio). Un segreto committato e poi
          # tolto passava il controllo per sempre, pur restando dentro
          # `git log -p` — cioe' pur restando estraibile da chiunque.
          fetch-depth: 0

      # Se un segreto entra nella repo il danno e' fatto nel momento in
      # cui si pusha, quindi meglio urlare subito.
      - name: Nessun segreto nella repo
        run: |
          if git ls-files | grep -E '^(config\.py|.*\.db|foto/)' ; then
            echo "::error::File che non devono MAI stare nella repo"
            exit 1
          fi
          # Il -I salta i file binari: dentro le 52 illustrazioni un
          # byte messo per caso puo' somigliare a qualunque cosa, e una
          # CI che diventa rossa a caso non la guarda piu' nessuno.
          if git ls-files -z | xargs -0 grep -lIE 'nsec1[0-9a-z]{50,}' ; then
            echo "::error::Sembra esserci una chiave privata Nostr"
            exit 1
          fi
          # Il token del bot: <id>:<segreto>. Le lunghezze sono LARGHE
          # apposta (Telegram ne ha cambiate nel tempo): meglio un falso
          # allarme da guardare che un token vero che passa perche' era
          # un carattere piu' corto del previsto.
          if git ls-files -z | xargs -0 grep -lIE '[0-9]{8,12}:[A-Za-z0-9_-]{30,}' ; then
            echo "::error::Sembra esserci un token del bot Telegram"
            exit 1
          fi
          if git ls-files -z | xargs -0 grep -lIE 'sk-ant-[A-Za-z0-9_-]{20,}' ; then
            echo "::error::Sembra esserci una chiave Anthropic"
            exit 1
          fi
          # Le chiavi LNbits (una delle quali PAGA), il segreto del
          # webhook e la chiave dei contenuti digitali: fino a ieri
          # nessuna delle quattro regole le guardava. Il grep -v toglie
          # i segnaposto del config d'esempio, che sono l'unica cosa che
          # deve combaciare qui dentro.
          if git ls-files -z | xargs -0 grep -nIE "$FORME" \
               | grep -vE "$SEGNAPOSTI" ; then
            echo "::error::Sembra esserci una chiave vera in un file"
            exit 1
          fi
          # La chiave Nostr in esadecimale nudo (64 caratteri). Fuori
          # vendor/, dove nostr.bundle.js ne contiene per mestiere ed e'
          # l'unico file del repo che lo fa.
          #
          # E fuori i QUATTRO file della configurazione del relay, che
          # ne portano uno ciascuno ed e' PUBBLICO in tutti i casi: il
          # digest dell'immagine strfry nel Dockerfile (inchiodato apposta
          # invece di un tag che si muove, e cambia a ogni aggiornamento
          # dell'immagine), la chiave PUBBLICA della piattaforma nel
          # plugin e in strfry.conf — quella che il relay serve gia' da
          # se' nel suo NIP-11 a chiunque gliela chieda, e che il plugin
          # confronta col campo `pubkey` degli eventi: una chiave privata
          # li' dentro non ci potrebbe stare per costruzione — e la
          # chiave PUBBLICA del coordinator Mostro in router.conf, che
          # firma il libro ordini che tutti leggono e sta anche nel
          # config di Barattolo come `MOSTRO_NPUB` (stessa chiave, altro
          # alfabeto: i filtri Nostr non parlano bech32).
          #
          # IL QUARTO E' ARRIVATO COME IL COMMENTO DICEVA (set 2026, lo
          # specchio del libro P2P): «un quarto file messo li' domani
          # torna sotto la regola da solo». C'e' tornato, e si e'
          # dichiarato qui invece di allargare la regola alla cartella.
          #
          # SI ESCLUDONO I FILE E MAI LA CARTELLA, ed e' la riga da
          # non allargare: in deploy/relay/ non deve entrare mai
          # policy/chiavi.txt, che e' un elenco di 64-hex uno per riga,
          # cioe' esattamente quel che questa regola prende. Escludendo
          # la cartella si spegnerebbe la guardia sul file che piu' di
          # ogni altro deve farla scattare — e un quarto file messo li'
          # domani torna sotto la regola da solo.
          #
          # LA STESSA LISTA VALE PER LA CRONOLOGIA, piu' sotto: sono due
          # letture della stessa domanda, e due liste che divergono
          # lasciano rossa la storia mentre l'albero e' pulito.
          if git ls-files -z -- . ':!vendor/' \
               ':!deploy/relay/Dockerfile' \
               ':!deploy/relay/strfry.conf' \
               ':!deploy/relay/policy/chi-scrive.py' \
               ':!deploy/relay/router.conf' \
               | xargs -0 grep -lIE "$FORMA_HEX" ; then
            echo "::error::Sembra esserci una chiave privata in esadecimale"
            exit 1
          fi
          echo "pulito"

      # E la stessa domanda fatta a TUTTA la cronologia, che e' la
      # differenza fra «oggi non c'e'» e «non c'e' mai stato»: un
      # segreto committato e poi rimosso resta estraibile da git per
      # sempre, e va ruotato — saperlo il giorno stesso vale il paio di
      # secondi che costa (misurato su questo repo: ~2s per 516
      # commit). Si guardano le righe AGGIUNTE: cio' che e' esistito
      # e' stato aggiunto una volta.
      #
      # IMPERFEZIONE DICHIARATA: `git log -p` non mostra i diff dei
      # commit di MERGE, quindi un segreto introdotto risolvendo un
      # conflitto sfuggirebbe. Il `-m` lo coprirebbe al prezzo di una
      # passata molto piu' rumorosa; si e' scelto di lasciarlo fuori e
      # di scriverlo qui invece di far finta che la copertura sia
      # completa.
      - name: E nemmeno nella cronologia
        run: |
          if git log --all -p --no-color | grep -a '^+' \
               | grep -aE "$FORME" | grep -avE "$SEGNAPOSTI" ; then
            echo "::error::Un segreto e' passato dalla repo in passato: va RUOTATO"
            exit 1
          fi
          # E la stessa domanda per l'esadecimale nudo, che fino ad ago
          # 2026 la cronologia non la faceva: era il buco piu' largo dei
          # due, perche' l'albero di lavoro si ripulisce con un commit e
          # la storia no. Misurato il giorno in cui si e' chiuso: due
          # valori, tolti dai file un'ora prima e ancora li' dentro.
          #
          # Il --full-history NON e' un ornamento: con un pathspec git
          # semplifica la storia e SALTA dei commit (misurato su questo
          # repo: 867 invece di 868) — cioe' proprio quello che una
          # passata di sicurezza non puo' permettersi. Le eccezioni sono
          # LE STESSE dei file di oggi — vendor/ e i quattro del relay — o il
          # bundle si denuncerebbe da solo a ogni giro e i tre valori
          # pubblici del relay farebbero rossa ogni passata dal commit in
          # avanti: qui si guardano le righe AGGIUNTE di tutta la storia,
          # che un commit dopo non ripulisce. Il perche' di ognuna sta
          # sul controllo di sopra, in un posto solo: due copie di quel
          # ragionamento divergono.
          if git log --all --full-history -p --no-color -- . ':!vendor/' \
               ':!deploy/relay/Dockerfile' \
               ':!deploy/relay/strfry.conf' \
               ':!deploy/relay/policy/chi-scrive.py' \
               ':!deploy/relay/router.conf' \
               | grep -a '^+' | sed -E "$CARTONE_HEX" \
               | grep -aE "$FORMA_HEX" ; then
            echo "::error::Una chiave esadecimale nuda e' passata dalla repo: va RUOTATA"
            exit 1
          fi
          echo "cronologia pulita"
  # ---------------- IL SEMAFORO DEL DEPLOY (ago 2026) ---------------
  #
  # Il VPS guarda il ref `pronto`, e a farlo avanzare e' questo job,
  # che parte solo quando le due domande di sopra hanno gia' risposto
  # di si'.
  #
  # DAL 21 SET 2026 E' UN CAMPANELLO, NON UNA PROVA. Qui c'era scritto
  # che «la CI e' verde» stava nel fatto stesso che il ref si fosse
  # mosso: ma su un repo privato gratuito i rami non si proteggono, e
  # `pronto` lo sposta chiunque abbia scrittura — senza passare di qui.
  # Quindi il VPS, prima di tirare, lo CHIEDE: che il commit stia su
  # main e che `prove` e `segreti` siano verdi su di lui (deploy.sh e
  # giudice_deploy.py, che guarda i NOMI di questi due lavori: chi li
  # rinomina arrossisce in prove.py).
  #
  # E' anche il motivo per cui il deploy e' PULL e non PUSH: nessuna
  # chiave del server sta nei secret di questo repo. Da qui non si
  # entra in produzione — si alza una bandierina, e a decidere cosa
  # farne e' la macchina che i sats ce li ha davvero.
  #
  # Solo su main, e solo sui push: una PR verde non deve poter mettere
  # niente in produzione.
  pronto:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [prove, segreti]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # La STORIA INTERA, e non e' un dettaglio: il checkout di serie e'
      # SHALLOW (un commit solo), quindi git non puo' dimostrare che
      # `pronto` sia un antenato di main e RIFIUTA il push anche quando
      # divergenza non ce n'e'. Il primo giro era passato solo perche'
      # CREAVA il ref; dal secondo push in poi cadeva sempre, con la
      # bandierina ferma e la CI rossa a ogni commit di chiunque.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # --force NO, e non e' pignoleria: `pronto` deve poter solo
      # AVANZARE lungo main. Se un giorno il push venisse rifiutato
      # vuol dire che i due rami hanno divergito — cioe' che qualcuno
      # ha riscritto la storia — ed e' esattamente il momento in cui
      # un deploy automatico deve fermarsi e farsi guardare. Ed e' la
      # storia intera qui sopra a rendere VERA questa riga: senza, un
      # rifiuto non distingueva una divergenza da un clone corto.
      - name: Alza la bandierina per il VPS
        run: git push origin HEAD:refs/heads/pronto
