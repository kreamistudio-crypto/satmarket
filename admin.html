<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cruscotto Barattolo</title>
<!-- IL CRUSCOTTO DEGLI ADMIN (ott 2026). Questa pagina NON porta dati:
     li chiede a /api/admin/cruscotto, che controlla chi e' admin.
     Dentro Telegram si apre nella stessa webview della Mini App, e lo
     SDK ritrova l'initData; dal browser vale il cookie di sessione. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url(/vendor/font/baloo2-latin.woff2) format('woff2')}
  @font-face{font-family:'Nunito';font-weight:400 800;font-display:swap;src:url(/vendor/font/nunito-latin.woff2) format('woff2')}
  :root{
    --bg:#FAF4E4; --card:#FFFFFF; --ink:#23282C; --muted:#8A8271; --soft:#5d574b;
    --line:#E8DFC8; --grid:#EFE8D6;
    --sats:#F7931A; --sats-soft:#FDEBD3;
    --s-tg:#2a78d6; --s-nostr:#eb6834; --s-vol:#F7931A;
    --ok:#1B8B54; --ok-soft:#E7F5EC; --err:#C2410C;
    --rosso-p2p:#C33A1A; --rosso-p2p-soft:#FDE8E5;
    --radius:16px; --shadow:0 1px 4px rgba(60,45,10,.08);
    /* IL CRUSCOTTO SEMPLICE (16 ott 2026): le leve della Mini App, gli
       stessi valori (miniapp.html, :root e html[data-tema="scuro"]). Tre
       colori di STATO e basta: bene, guarda, urgente. Compra e Vendi
       del grafico sono i colori del P2P dell'app (verde e rosso). */
    --line-soft:#EFE6D0; --trust:#1B8B54; --guarda:#F7931A; --guarda-testo:#A85A00;
    --guarda-soft:#FDEBD3; --urgente:#C33A1A; --urgente-soft:#FDE8E5;
    --b-r:14px; --b-font:'Baloo 2','Nunito',sans-serif;
    --b-pri-bg:linear-gradient(180deg,#FFAE4F 0%,#F7931A 58%,#EF880E 100%);
    --b-pri-fg:#2A1600; --b-pri-line:rgba(170,90,0,.38);
    --b-pri-sh:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(120,60,0,.22),0 7px 16px -7px rgba(232,128,10,.75);
    --b-sec-bg:#FFFFFF; --b-sec-fg:#23282C; --b-sec-line:rgba(35,40,44,.16);
    --b-sec-sh:0 1px 2px rgba(35,40,44,.08),0 5px 12px -7px rgba(35,40,44,.28);
    /* le fonti dei guadagni (27 nov 2026): sei colori ben distinti */
    --f-merc:#2a78d6; --f-p2p:#1B8B54; --f-rout:#7B5BD6; --f-zap:#F7931A; --f-labs:#0E8C8C; --f-altro:#8A8271;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211A10; --card:#2C2517; --ink:#F1E8D5; --muted:#A99F87; --soft:#cfc5ad;
      --line:#3E3623; --grid:#3a3121; --sats:#F7931A; --sats-soft:#3E2B12;
      --s-tg:#3987e5; --s-nostr:#d95926; --s-vol:#F7931A;
      --ok:#34B47A; --ok-soft:#1B2C20; --err:#F28B5B;
      --rosso-p2p:#F26E4E; --rosso-p2p-soft:#3D2017;
      --shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
      --line-soft:#352E1F; --trust:#34B47A; --guarda-testo:#FFB25C;
      --guarda-soft:#3E2B12; --urgente:#F26E4E; --urgente-soft:#3D2017;
      --b-pri-sh:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.45),0 8px 20px -8px rgba(247,147,26,.5);
      --b-sec-bg:#3A3122; --b-sec-fg:#F1E8D5; --b-sec-line:rgba(241,232,213,.14);
      --b-sec-sh:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 6px 14px -8px rgba(0,0,0,.7);
      --f-merc:#3987e5; --f-p2p:#34B47A; --f-rout:#9B80F0; --f-zap:#F7931A; --f-labs:#2BB3B3; --f-altro:#A99F87;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211A10; --card:#2C2517; --ink:#F1E8D5; --muted:#A99F87; --soft:#cfc5ad;
    --line:#3E3623; --grid:#3a3121; --sats:#F7931A; --sats-soft:#3E2B12;
    --s-tg:#3987e5; --s-nostr:#d95926; --s-vol:#F7931A;
    --ok:#34B47A; --ok-soft:#1B2C20; --err:#F28B5B;
    --rosso-p2p:#F26E4E; --rosso-p2p-soft:#3D2017;
    --shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);
    --line-soft:#352E1F; --trust:#34B47A; --guarda-testo:#FFB25C;
    --guarda-soft:#3E2B12; --urgente:#F26E4E; --urgente-soft:#3D2017;
    --b-pri-sh:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.45),0 8px 20px -8px rgba(247,147,26,.5);
    --b-sec-bg:#3A3122; --b-sec-fg:#F1E8D5; --b-sec-line:rgba(241,232,213,.14);
    --b-sec-sh:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4),0 6px 14px -8px rgba(0,0,0,.7);
    --f-merc:#3987e5; --f-p2p:#34B47A; --f-rout:#9B80F0; --f-zap:#F7931A; --f-labs:#2BB3B3; --f-altro:#A99F87;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.45}
  main{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
  h1{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:32px;margin:8px 0 6px;color:var(--ink)}
  h2{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:22px;margin:0 0 12px;color:var(--ink)}
  .sub{color:var(--muted);font-weight:600;font-size:14px}
  .filtri{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}
  .filtri button{font:inherit;font-weight:800;font-size:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 18px;cursor:pointer;transition:all .15s}
  .filtri button:hover{border-color:var(--sats);background:var(--sats-soft)}
  .filtri button[aria-pressed="true"]{background:var(--sats);color:#fff;border-color:var(--sats)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .15s}
  .tile:hover{border-color:var(--sats);box-shadow:0 8px 24px rgba(0,0,0,.07)}
  .tile .k{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .tile .v{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:36px;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;color:var(--sats)}
  .tile .d{color:var(--soft);font-weight:600;font-size:13px;margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:24px 0;box-shadow:var(--shadow)}
  .legenda{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--soft);margin:12px 0 16px}
  .legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-2px}
  .grafico{position:relative;width:100%;margin:12px 0}
  .grafico svg{display:block;width:100%;height:auto;overflow:visible}
  .grafico text{fill:var(--muted);font:600 12px 'Nunito',system-ui,sans-serif}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .tip.on{opacity:1}
  details{margin-top:12px}
  summary{cursor:pointer;color:var(--soft);font-weight:800;font-size:14px;padding:8px 0;transition:color .15s}
  summary:hover{color:var(--sats)}
  table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  td.n,th.n{text-align:right}
  .tab{overflow-x:auto;margin:12px 0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .nota{color:var(--soft);font-weight:600;font-size:14px;margin-top:10px;line-height:1.5}
  .simu{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:16px 0;padding:16px;background:var(--sats-soft);border-radius:var(--radius)}
  .simu input[type=range]{flex:1;min-width:180px;accent-color:var(--sats)}
  .simu output{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:28px;min-width:80px;color:var(--sats)}
  .simu select{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
  .simu label{font-weight:700;color:var(--ink)}
  .stato{background:var(--rosso-p2p-soft);border:2px solid var(--rosso-p2p);border-radius:var(--radius);padding:20px;margin-top:20px;font-weight:700;color:var(--rosso-p2p)}
  .barra{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--grid);min-width:100px;gap:2px}
  .barra b{display:block;background:var(--sats)} .barra s{display:block;background:var(--ok);text-decoration:none}
  a{color:var(--sats);text-decoration:none;font-weight:700;transition:color .15s}
  a:hover{color:var(--rosso-p2p)}
  @media (max-width:640px){
    h1{font-size:26px}
    h2{font-size:18px}
    .tile{padding:16px}
    .tile .v{font-size:28px}
    .tile .k{font-size:10px}
    .tiles{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
    .simu{flex-direction:column;align-items:stretch}
    .simu input[type=range]{min-width:100%}
    .simu output{text-align:center;width:100%}
    .simu select{width:100%}
  }
  @media (max-width:480px){
    main{padding:16px 12px 40px}
    h1{font-size:22px}
    h2{font-size:16px}
    .card{padding:16px}
    .tile .v{font-size:24px}
  }
  /* ===== IL CRUSCOTTO SEMPLICE (16 ott 2026, cantiere cruscotto-admin) =====
     In primo piano tre domande — cosa devo fare, va tutto bene, come va
     la settimana — e il grafico ordini P2P / prezzo. Tutto il resto sta
     in «Altro», chiuso, con le stesse funzioni di prima. Le misure sono
     quelle della Mini App: carte da 18px di raggio, gruppi da 16, bottoni
     da 14, numeri in Baloo 2. */
  main{max-width:760px}
  .testa{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
  .testa h1{margin:0}
  .sez{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:19px;margin:22px 2px 10px;color:var(--ink)}
  .carte{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .carta{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;border:1px solid var(--line-soft);min-width:0}
  .carta .n{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink);overflow-wrap:anywhere}
  .carta .p{font-weight:700;font-size:14px;color:var(--soft);margin-top:4px;line-height:1.3}
  .carta.bene{background:var(--ok-soft);border-color:transparent}
  .carta.bene .n{color:var(--ok)}
  .carta.guarda{background:var(--guarda-soft);border-color:var(--guarda)}
  .carta.guarda .n{color:var(--guarda-testo)}
  .carta.urgente{background:var(--urgente-soft);border-color:var(--urgente)}
  .carta.urgente .n{color:var(--urgente)}
  .dove{font-weight:700;font-size:13px;color:var(--muted);margin:8px 2px 0}
  .salute{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:4px 14px}
  .riga{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .riga:last-child{border-bottom:0}
  .riga .pallino{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ok)}
  .riga.guarda .pallino{background:var(--guarda)}
  .riga.urgente .pallino{background:var(--urgente)}
  .riga b{font-weight:800;font-size:15px;min-width:74px}
  .riga span{margin-left:auto;text-align:right;font-weight:700;font-size:14px;color:var(--soft);overflow-wrap:anywhere}
  .riga.urgente span{color:var(--urgente)}
  /* tre file a griglia, una per scelta: a 320 px nessun bottone va a capo
     da solo in mezzo agli altri */
  .scelte{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin:10px 0 0}
  .scelte.quattro{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
  @media (max-width:380px){ .scelte.quattro{grid-template-columns:repeat(2,1fr)} }
  .scelte button{font-family:var(--b-font);font-weight:800;font-size:14px;min-height:38px;padding:6px 4px;border-radius:12px;cursor:pointer;min-width:0;
    background:var(--b-sec-bg);color:var(--b-sec-fg);border:1px solid var(--b-sec-line);box-shadow:var(--b-sec-sh)}
  .scelte button[aria-pressed="true"]{background:var(--b-pri-bg);color:var(--b-pri-fg);border-color:var(--b-pri-line);box-shadow:var(--b-pri-sh)}
  .scelte + .scelte{margin-top:6px}
  .riquadro{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:14px}
  .legami{margin-top:6px;font-weight:700;font-size:14px;line-height:1.45}
  .legami div{margin-top:4px}
  .legami .sub{font-size:13px}
  .pezzo{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
  /* ALTRO: i gruppi del profilo della Mini App (.grp), qui su <details> */
  details.grp{margin:10px 0 0;background:var(--card);border:1px solid var(--line-soft);border-radius:16px;overflow:hidden}
  details.grp > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:16px;font-weight:800;color:var(--ink);line-height:1.25}
  details.grp > summary::-webkit-details-marker{display:none}
  details.grp > summary::after{content:'▾';margin-left:auto;color:var(--muted);font-size:13px;transition:transform .18s ease}
  details.grp[open] > summary::after{transform:rotate(180deg)}
  details.grp > summary:hover{color:var(--ink)}
  .grp-b{padding:0 14px 14px}
  /* dentro un gruppo la vecchia card perde la cornice e il titolo, che
     e' gia' la riga del gruppo */
  .grp-b > .card{border:0;box-shadow:none;background:none;padding:0;margin:8px 0 0}
  .grp-b > .card > h2:first-child{display:none}
  .pila > .card{border:0;box-shadow:none;background:none;padding:0;margin:18px 0 0}
  #p2p > h1:first-child{display:none}
  /* 💰 GUADAGNI E SPESE (27 nov 2026) */
  .fonte{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 6px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-weight:700;font-size:14px}
  .fonte:last-child{border-bottom:0}
  .fonte .barra{height:6px;min-width:0}
  .azioni{display:flex;gap:6px;margin-left:auto}
  .azioni button,.modulo input,.modulo select{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--b-sec-line);background:var(--b-sec-bg);color:var(--ink);border-radius:10px;padding:6px 10px;min-height:36px}
  .azioni button{cursor:pointer}
  .modulo{display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
  .modulo input,.modulo select{width:100%;min-width:0}
  .modulo .due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:480px){
    .carta .n{font-size:30px}
    .grp-b{padding:0 10px 12px}
  }
</style>
</head>
<body>
<main>
  <div class="testa"><h1>🫙 Cruscotto</h1></div>
  <div class="sub" id="sub">Carico i numeri…</div>
  <div id="corpo"></div>
  <!-- SCAMBI P2P (10 ott 2026): resta VUOTO per chi non e' amministratore.
       Il cruscotto dice un si' o un no, e i numeri li da' un'altra rotta
       che rifa' la stessa domanda (`vede_statistiche_p2p`). Dal 16 ott
       sta in fondo ad «Altro», nel suo gruppo, che nasce nascosto e si
       mostra solo quando la rotta ha detto di si'. -->
  <details class="grp" id="p2pBox" hidden><summary>🔁 Scambi P2P</summary><div class="grp-b"><div id="p2p"></div></div></details>
</main>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
/* IL TEMA (16 ott 2026): quello di Telegram SOLO dentro Telegram. Fuori,
   lo SDK dice comunque «light», e la pagina restava chiara anche su un
   telefono in scuro: senza initData vale il tema del telefono (la media
   query qui sopra). */
try { if (tg && tg.initData && tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme; } catch(e){}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('it-IT');
const fmtd = (n, d) => Number(n || 0).toLocaleString('it-IT', {maximumFractionDigits: d});
const el = id => document.getElementById(id);
let D = null, giorni = 90;

/* L'identita': dentro Telegram l'initData, fuori il cookie. In collaudo
   (`?collaudo=999`) l'identita' finta che il server accetta SOLO in
   modalita' collaudo. */
function intestazione(){
  if (tg && tg.initData) return tg.initData;
  const c = new URLSearchParams(location.search).get('collaudo');
  return /^\d{1,6}$/.test(c || '') ? `collaudo:${c}:Admin` : '';
}

async function carica(){
  let r;
  try {
    r = await fetch('/api/admin/cruscotto', {credentials:'same-origin',
      headers:{'X-Tg-Init-Data': intestazione()}});
  } catch(e) { return stato('Non riesco a raggiungere Barattolo: riprova fra poco.'); }
  if (r.status === 401) return stato('Entra prima su Barattolo (da questo browser o dall\'app), poi riapri questa pagina.');
  if (r.status === 403) return stato('Questa pagina è riservata agli admin.');
  if (!r.ok) return stato(`Il server ha risposto ${r.status}.`);
  D = await r.json();
  el('sub').textContent = 'Aggiornato alle ' + new Date(D.generato * 1000)
    .toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  disegna();
  caricaServizi();
  caricaGrafico();
  if (D.p2p_statistiche) caricaP2P();
  if (D.p2p_statistiche) caricaSettimanaP2P();
  if (D.p2p_statistiche) caricaGuadagni();
}
function stato(t){ el('sub').textContent = ''; el('corpo').innerHTML = `<div class="stato">${esc(t)}</div>`; }

/* ---- il tempo: i giorni del server diventano secchi ---- */
const GIORNO = 86400000;
const gran = () => giorni && giorni <= 31 ? 'giorno' : (giorni && giorni <= 180 ? 'settimana' : 'mese');
function chiave(g, modo){
  if (modo === 'giorno') return g;
  if (modo === 'mese') return g.slice(0, 7);
  const d = new Date(g + 'T00:00:00Z');
  const lun = new Date(d.getTime() - ((d.getUTCDay() + 6) % 7) * GIORNO);
  return lun.toISOString().slice(0, 10);
}
function etichetta(k, modo){
  if (modo === 'mese') { const [a, m] = k.split('-'); return new Date(Date.UTC(+a, +m - 1, 1)).toLocaleDateString('it-IT', {month:'short', year:'2-digit'}); }
  return new Date(k + 'T00:00:00Z').toLocaleDateString('it-IT', {day:'numeric', month:'short'});
}
function inizio(){
  if (!giorni) {
    const prime = [D.iscritti[0]?.[0], D.volume[0]?.[0]].filter(Boolean).sort();
    return prime[0] || new Date().toISOString().slice(0, 10);
  }
  return new Date(Date.now() - (giorni - 1) * GIORNO).toISOString().slice(0, 10);
}
/* tutti i secchi del periodo, anche quelli vuoti: un buco nel tempo e'
   uno zero, non un salto */
function secchi(){
  const modo = gran(), out = [], visti = new Set();
  for (let t = new Date(inizio() + 'T00:00:00Z').getTime(); t <= Date.now(); t += GIORNO) {
    const k = chiave(new Date(t).toISOString().slice(0, 10), modo);
    if (!visti.has(k)) { visti.add(k); out.push(k); }
  }
  return out;
}
function somma(righe, colonne){
  const modo = gran(), da = inizio(), m = {};
  for (const r of righe) {
    if (r[0] < da) continue;
    const k = chiave(r[0], modo);
    const v = m[k] || (m[k] = colonne.map(() => 0));
    colonne.forEach((c, i) => v[i] += r[c]);
  }
  return m;
}

/* ---- i grafici: SVG a mano, una scala sola, marchi sottili ---- */
/* LA LARGHEZZA E' QUELLA VERA del riquadro, non una fissa scalata: su
   un telefono un viewBox da 720 rimpicciolirebbe le scritte a 6px */
let W = 720;
const H = 240, SX = 44, DX = 8, ALTO = 12, BASSO = 26;
const misura = box => { W = Math.max(280, Math.round(box.clientWidth || 720)); };
function tacche(max){
  if (max <= 0) return [0];
  const passo = Math.pow(10, Math.floor(Math.log10(max)));
  const p = [1, 2, 5, 10].map(x => x * passo).find(x => max / x <= 5) || passo * 10;
  const out = []; for (let v = 0; v <= max + 1e-9; v += p) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + p);
  return out;
}
const breve = n => n >= 1e6 ? fmtd(n / 1e6, 1) + ' M' : n >= 1e4 ? fmtd(n / 1e3, 0) + 'k' : fmt(n);
function asse(t, y){
  return t.map(v => `<line x1="${SX}" x2="${W - DX}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`
    + `<text x="${SX - 6}" y="${y(v) + 4}" text-anchor="end">${breve(v)}</text>`).join('');
}
function assex(ks, x, larg, modo = gran()){
  const ogni = Math.max(1, Math.ceil(ks.length / Math.max(2, Math.floor(W / 90))));
  return ks.map((k, i) => i % ogni ? '' :
    `<text x="${x(i) + larg / 2}" y="${H - 8}" text-anchor="middle">${esc(etichetta(k, modo))}</text>`).join('');
}
/* barre impilate (o una serie sola): 2px di aria fra i pezzi, la cima
   arrotondata, il tooltip su tutta la colonna */
function barre(box, ks, serie, valori, testoTip, modo = gran()){
  misura(box);
  const n = ks.length, larg = (W - SX - DX) / Math.max(1, n);
  const tot = ks.map(k => (valori[k] || []).reduce((a, b) => a + b, 0));
  const t = tacche(Math.max(1, ...tot)), max = t[t.length - 1];
  const y = v => ALTO + (H - ALTO - BASSO) * (1 - v / max);
  const x = i => SX + i * larg;
  const b = Math.max(2, Math.min(28, larg - 4));
  let svg = asse(t, y);
  ks.forEach((k, i) => {
    let base = 0;
    const v = valori[k] || serie.map(() => 0);
    serie.forEach((s, j) => {
      if (!v[j]) return;
      const y0 = y(base), y1 = y(base + v[j]); base += v[j];
      const cima = j === serie.length - 1 || !v.slice(j + 1).some(Boolean);
      const h = Math.max(1, y0 - y1 - (base > v[j] ? 2 : 0));
      const r = cima ? Math.min(4, b / 2, h) : 0;
      const xx = x(i) + (larg - b) / 2, yy = y1;
      svg += r
        ? `<path d="M${xx},${yy + h} V${yy + r} Q${xx},${yy} ${xx + r},${yy} H${xx + b - r} Q${xx + b},${yy} ${xx + b},${yy + r} V${yy + h} Z" fill="${s.colore}"/>`
        : `<rect x="${xx}" y="${yy}" width="${b}" height="${h}" fill="${s.colore}"/>`;
    });
    svg += `<rect class="hit" data-i="${i}" x="${x(i)}" y="${ALTO}" width="${larg}" height="${H - ALTO - BASSO}" fill="transparent"/>`;
  });
  svg += assex(ks, x, larg, modo);
  monta(box, svg, i => ({x: x(i) + larg / 2, y: y(tot[i]), testo: testoTip(ks[i], valori[ks[i]] || serie.map(() => 0))}));
}
/* linee cumulate: 2px, l'etichetta diretta in coda, crosshair */
function linee(box, ks, serie, punti, testoTip){
  misura(box);
  const n = ks.length, passo = (W - SX - DX) / Math.max(1, n - 1);
  const t = tacche(Math.max(1, ...serie.flatMap((s, j) => ks.map(k => punti[k][j])))), max = t[t.length - 1];
  const y = v => ALTO + (H - ALTO - BASSO) * (1 - v / max);
  const x = i => SX + (n === 1 ? (W - SX - DX) / 2 : i * passo);
  let svg = asse(t, y);
  serie.forEach((s, j) => {
    svg += `<polyline fill="none" stroke="${s.colore}" stroke-width="2" stroke-linejoin="round" points="${ks.map((k, i) => `${x(i)},${y(punti[k][j])}`).join(' ')}"/>`;
    const ult = punti[ks[n - 1]][j];
    svg += `<text x="${x(n - 1) - 4}" y="${y(ult) - 6}" text-anchor="end" style="fill:var(--soft);font-weight:800">${esc(s.nome)} ${fmt(ult)}</text>`;
  });
  svg += `<line class="croce" x1="0" x2="0" y1="${ALTO}" y2="${H - BASSO}" stroke="var(--muted)" stroke-width="1" style="display:none"/>`;
  ks.forEach((k, i) => svg += `<rect class="hit" data-i="${i}" x="${x(i) - passo / 2}" y="${ALTO}" width="${Math.max(passo, 6)}" height="${H - ALTO - BASSO}" fill="transparent"/>`);
  svg += assex(ks, i => x(i) - 0, 0);
  monta(box, svg, i => ({x: x(i), y: y(Math.max(...punti[ks[i]])), testo: testoTip(ks[i], punti[ks[i]]), croce: x(i)}));
}
function monta(box, svg, info){
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${svg}</svg><div class="tip"></div>`;
  const s = box.querySelector('svg'), tip = box.querySelector('.tip'), croce = s.querySelector('.croce');
  const mostra = e => {
    const r = e.target.closest('.hit'); if (!r) return;
    const d = info(+r.dataset.i), k = s.getBoundingClientRect().width / W;
    tip.innerHTML = d.testo; tip.style.left = (d.x * k) + 'px'; tip.style.top = (d.y * k - 8) + 'px';
    tip.classList.add('on');
    if (croce) { croce.style.display = ''; croce.setAttribute('x1', d.croce); croce.setAttribute('x2', d.croce); }
  };
  s.addEventListener('pointermove', mostra); s.addEventListener('pointerdown', mostra);
  s.addEventListener('pointerleave', () => { tip.classList.remove('on'); if (croce) croce.style.display = 'none'; });
}
const legenda = serie => `<div class="legenda">${serie.map(s => `<span><i style="background:${s.colore}"></i>${esc(s.nome)}</span>`).join('')}</div>`;
const colore = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* I tre grafici di «Iscritti e vendite» si disegnano solo a gruppo
   APERTO: chiuso, il riquadro e' largo zero, e l'SVG nascerebbe largo
   720 e rimpicciolito (le scritte a 6px che `misura` esiste per non
   fare). Il gruppo li ridisegna quando si apre. */
function disegnaGrafici(){
  const g = el('altroIscritti');
  if (!g || !g.open) return;
  const ks = secchi(), modo = gran();
  const nuovi = somma(D.iscritti, [1, 2]), vend = somma(D.volume, [1, 2, 3]);
  barre(el('gNuovi'), ks, [{colore:colore('--s-tg')}, {colore:colore('--s-nostr')}], nuovi,
    (k, v) => `${esc(etichetta(k, modo))} · Telegram ${fmt(v[0])} · Nostr ${fmt(v[1])}`);
  /* il cumulato parte da chi c'era PRIMA del periodo */
  const da = inizio(); let base = [0, 0];
  for (const r of D.iscritti) if (r[0] < da) { base[0] += r[1]; base[1] += r[2]; }
  const cum = {}; ks.forEach(k => { const v = nuovi[k] || [0, 0]; base = [base[0] + v[0], base[1] + v[1]]; cum[k] = base.slice(); });
  linee(el('gTotali'), ks, [{nome:'Telegram', colore:colore('--s-tg')}, {nome:'Nostr', colore:colore('--s-nostr')}], cum,
    (k, v) => `${esc(etichetta(k, modo))} · Telegram ${fmt(v[0])} · Nostr ${fmt(v[1])} · totale ${fmt(v[0] + v[1])}`);
  const vSats = {}; Object.keys(vend).forEach(k => vSats[k] = [vend[k][1]]);
  barre(el('gVolume'), ks, [{colore:colore('--s-vol')}], vSats,
    k => `${esc(etichetta(k, modo))} · ${fmt((vend[k] || [0, 0])[1])} sats · ${fmt((vend[k] || [0])[0])} ordini`);
}

function simula(){
  const f = Number(el('fee').value) / 100, base = el('base').value === 'sats' ? 1 : 2;
  el('feeV').textContent = fmtd(f * 100, 2) + '%';
  const vend = somma(D.volume, [1, 2, 3]);
  const per = Object.values(vend).reduce((a, v) => a + v[base], 0);
  const sempre = base === 1 ? D.volume_totale.sats : D.volume_totale.merce;
  const tre = D.volume.filter(r => r[0] >= new Date(Date.now() - 89 * GIORNO).toISOString().slice(0, 10)).reduce((a, r) => a + r[base + 1], 0);
  const eur = s => D.eur_per_btc > 0 ? `≈ € ${fmtd(s / 1e8 * D.eur_per_btc, 0)}` : '';
  const t = (k, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${fmt(Math.floor(s * f))} sats</div><div class="d">${eur(s * f)}</div></div>`;
  el('simuOut').innerHTML = t('Da sempre', sempre)
    + t(giorni ? `Negli ultimi ${giorni} giorni` : 'Nel periodo', per)
    + t('Al mese (media ultimi 90 giorni)', tre / 3);
}

/* ===== IL CRUSCOTTO SEMPLICE (16 ott 2026, cantiere cruscotto-admin) =====
   Parola di Andrea: «prima la cosa da fare, poi lo stato, poi i numeri;
   un numero = una carta, con una parola che spiega; colori solo per dire
   tutto bene / guarda / urgente». Il resto sta in «Altro». */
const STILE = {bene: ' bene', guarda: ' guarda', urgente: ' urgente'};
const carta = (n, parola, stato, id) =>
  `<div class="carta${STILE[stato] || ''}"${id ? ` id="${id}"` : ''}><div class="n">${n}</div><div class="p">${parola}</div></div>`;
const piu = (n, uno, tanti) => n === 1 ? uno : tanti;

/* COSA DEVO FARE: quattro carte, verdi a zero. Le dispute P2P vengono
   dalla loro sezione; le altre tre da `da_fare`. Una voce che il server
   non sa (None) non ha la carta. */
function sezioneDaFare(){
  const F = D.da_fare || {}, X = D.dispute_p2p, voci = [];
  if (X) voci.push([X.aperte.length, piu(X.aperte.length, 'disputa P2P aperta', 'dispute P2P aperte'), 'urgente']);
  if (F.dispute_mercatino != null) voci.push([F.dispute_mercatino, piu(F.dispute_mercatino, 'disputa del mercatino', 'dispute del mercatino'), 'urgente']);
  if (F.annunci_revisione != null) voci.push([F.annunci_revisione, piu(F.annunci_revisione, 'annuncio da approvare', 'annunci da approvare'), 'guarda']);
  if (F.pagamenti_incerti != null) voci.push([F.pagamenti_incerti, piu(F.pagamenti_incerti, 'pagamento da verificare', 'pagamenti da verificare'), 'urgente']);
  const tante = voci.reduce((a, v) => a + v[0], 0);
  return `<div class="sez">Da fare</div>
  <div class="carte">${voci.map(([n, p, s]) => carta(fmt(n), p, n ? s : 'bene')).join('')}</div>
  <div class="dove">${tante ? 'Si decide in Barattolo: Profilo › 👑 Amministrazione.' : 'Niente da fare adesso.'}</div>`;
}

/* VA TUTTO BENE? Una riga per cosa, col pallino. Solo quel che il
   server sa gia': la risposta del nodo (cache del cruscotto), le ronde
   dei relay dalla loro memoria, il commit letto all'avvio, il cambio. */
const fa = s => s < 90 ? 'adesso' : s < 5400 ? `${Math.round(s / 60)} min fa`
  : s < 172800 ? `${Math.round(s / 3600)} ore fa` : `${Math.round(s / 86400)} giorni fa`;
function voceSalute(nome, stato, testo){
  return `<div class="riga${STILE[stato] || ''}"><i class="pallino"></i><b>${nome}</b><span>${esc(testo)}</span></div>`;
}
function sezioneSalute(L){
  const S = D.salute || {}, adesso = Date.now() / 1000, righe = [];
  const canali = L.canali || [], accesi = canali.filter(c => c.attivo).length;
  if (S.ponte === 'giu') righe.push(voceSalute('Nodo', 'urgente', 'il ponte verso LND è giù'));
  else if (L.stato !== 'ok') righe.push(voceSalute('Nodo', 'urgente', 'non risponde'));
  else righe.push(voceSalute('Nodo', canali.length && accesi === canali.length ? 'bene' : 'guarda',
    canali.length ? `${fmt(accesi)} su ${fmt(canali.length)} canali accesi` : 'canali non letti'));
  const ronde = (S.ronde || []).filter(r => r.accesa), tutti = ronde.flatMap(r => r.relay);
  const giu = tutti.filter(x => x.a_posto === false), chiesti = tutti.filter(x => x.a_posto != null);
  righe.push(!ronde.length ? voceSalute('Relay', 'guarda', 'ronda spenta')
    : giu.length ? voceSalute('Relay', 'urgente', `${fmt(giu.length)} su ${fmt(tutti.length)} con un problema`)
    : !chiesti.length ? voceSalute('Relay', 'guarda', 'primo giro in corso')
    : voceSalute('Relay', 'bene', `${fmt(chiesti.length)} su ${fmt(tutti.length)} a posto`));
  righe.push(S.commit ? voceSalute('Deploy', 'bene', `${S.commit.slice(0, 7)} · avviato ${fa(adesso - S.avviato)}`)
    : voceSalute('Deploy', 'guarda', 'commit non letto'));
  righe.push(!S.cambio_valido ? voceSalute('Cambio', 'urgente', 'fermo')
    : voceSalute('Cambio', S.cambio_eta_s > 900 ? 'guarda' : 'bene', 'aggiornato ' + fa(S.cambio_eta_s || 0)));
  return `<div class="sez">Va tutto bene?</div><div class="salute">${righe.join('')}</div>`;
}

/* 🩺 IL QUADRO DEI SERVIZI (25 nov 2026, seguito di quadro-servizi;
   Andrea: «questo cassetto possiamo metterlo anche nella pagina
   barattolo.store admin?»). Lo stesso cassetto del pannello della Mini
   App, dalla stessa rotta e con le stesse parole approvate: qui sotto
   «Va tutto bene?», chiuso, col conto dei rossi sul titolo. Arriva dopo
   i numeri, e una rotta che non risponde lascia la pagina com'era. */
let SRV = null;
async function caricaServizi(){
  try {
    const r = await fetch('/api/admin/servizi', {credentials:'same-origin',
      headers:{'X-Tg-Init-Data': intestazione()}});
    if (!r.ok) return;
    SRV = await r.json();
  } catch(e) { return; }
  const box = el('sezServizi');
  if (!box) return;
  const aperto = !!document.querySelector('#altroServizi[open]');
  box.innerHTML = sezioneServizi();
  if (aperto && el('altroServizi')) el('altroServizi').open = true;
}
function sezioneServizi(){
  const q = SRV;
  if (!q || !Array.isArray(q.servizi)) return '';
  const minimo = q.cert_giorni_min || 14;
  const certMale = c => c.letto && (c.giorni === null || c.giorni < minimo);
  const rossi = q.servizi.filter(v => v.stato === 'giu' || v.backup_vecchio).length
    + (q.certificati || []).filter(certMale).length;
  /* una riga a due piani: nome e macchina sopra, i numeri sotto (le
     colonne della «Va tutto bene?» spezzavano i nomi lunghi a 360px) */
  const riga = (st, nome, sotto) => `<div class="riga${STILE[st] || ''}" style="align-items:flex-start">
    <i class="pallino" style="margin-top:5px"></i><div style="flex:1;min-width:0">${nome}${sotto}</div></div>`;
  const piano = (t, rosso) => `<div class="nota" style="margin-top:2px${rosso ? ';color:var(--urgente)' : ''}">${t}</div>`;
  const righe = q.servizi.map(v => riga(
    v.stato === 'giu' || v.backup_vecchio ? 'urgente' : v.stato === 'su' ? 'bene' : 'guarda',
    `<b>${esc(v.nome)}</b> <small style="font-weight:700;color:var(--muted)">· ${esc(v.dove)}</small>`,
    (v.stato === 'mai' ? piano('Non ha mai dato segni di vita: il battito non è installato.')
      : piano(`Ultimo segnale ${fa(v.da_s || 0)} · uptime 30 giorni ${esc(String(v.uptime).replace('.', ','))}%`))
    + (v.backup_ore === null || v.backup_ore === undefined ? ''
      : piano(`${v.backup_vecchio ? '⚠️ ' : ''}Ultimo backup ${fa(v.backup_ore * 3600)}`, v.backup_vecchio)))).join('');
  const cert = (q.certificati || []).map(c => voceSalute(esc(c.host),
    !c.letto ? 'guarda' : certMale(c) ? 'urgente' : 'bene',
    !c.letto ? 'non ancora controllato' : c.giorni === null ? 'non si legge (scaduto o non valido)'
      : `scade fra ${c.giorni} giorni`)).join('');
  return `<details class="grp" id="altroServizi"><summary>🩺 Servizi <span style="font-size:14px;font-weight:700;color:${rossi ? 'var(--urgente)' : 'var(--soft)'}">${rossi ? `⚠️ ${rossi} da guardare` : 'tutto ok'}</span></summary><div class="grp-b">
    <div class="nota" style="margin-top:0">Ogni macchina manda un segnale ogni cinque minuti. Se uno smette, arriva un avviso nella stanza degli errori.${q.battiti_aperti ? '' : ' <b>I segnali delle altre macchine sono chiusi</b> (manca BATTITO_SEGRETO nel config): si vede solo il VPS.'}</div>
    <div class="salute" style="margin-top:10px">${righe}</div>
    <div class="nota" style="margin-top:14px">🔐 Certificati</div>
    <div class="salute" style="margin-top:6px">${cert}</div>
  </div></details>`;
}

/* ---- IL GRAFICO ORDINI P2P / PREZZO BTC ----
   I conteggi e la correlazione li fa il server (`/api/admin/p2p-grafico`,
   con i suoi giudici puri); qui si sceglie e si disegna. Passo e periodo
   richiedono i dati, la metrica no. */
let G = null, erroreG = '', metricaG = 'pubblicati', passoG = 'giorno', periodoG = '30';
const METRICHE_G = [['pubblicati', 'Pubblicati'], ['presi', 'Presi'], ['conclusi', 'Conclusi'], ['annullati', 'Annullati']];
const LATI_G = [['buy', 'Compra', '--trust'], ['sell', 'Vendi', '--rosso-p2p']];
async function caricaGrafico(){
  erroreG = '';
  try {
    const r = await fetch(`/api/admin/p2p-grafico?periodo=${encodeURIComponent(periodoG)}&passo=${encodeURIComponent(passoG)}`,
      {credentials: 'same-origin', headers: {'X-Tg-Init-Data': intestazione()}});
    if (!r.ok) throw new Error(`il server ha risposto ${r.status}`);
    G = await r.json();
  } catch(e) { G = null; erroreG = 'Non riesco a leggere gli ordini P2P: riprova fra poco.'; }
  const box = el('sezGrafico');
  if (box) { box.innerHTML = internoGrafico(); graficoP2P(); }
}
function scegliG(cosa, valore){
  if (cosa === 'metrica') metricaG = valore;
  if (cosa === 'passo') passoG = valore;
  if (cosa === 'periodo') periodoG = valore;
  if (cosa === 'metrica') { el('sezGrafico').innerHTML = internoGrafico(); graficoP2P(); }
  else caricaGrafico();
}
const bottoniG = (cosa, scelte, ora) => scelte.map(([v, t]) =>
  `<button aria-pressed="${v === ora}" onclick="scegliG('${cosa}','${v}')">${t}</button>`).join('');
function sezioneGrafico(){
  /* dal 27 nov 2026 sta in «Altro», nel suo gruppo: in cima ci sono i guadagni */
  return `<div class="riquadro" id="sezGrafico" style="box-shadow:none;border:0;padding:0;margin-top:8px">${internoGrafico()}</div>`;
}
function internoGrafico(){
  const scelte = `<div class="scelte quattro" role="group" aria-label="Cosa contare">${bottoniG('metrica', METRICHE_G, metricaG)}</div>
    <div class="scelte" role="group" aria-label="Passo">${bottoniG('passo', [['giorno', 'Per giorno'], ['settimana', 'Per settimana']], passoG)}</div>
    <div class="scelte" role="group" aria-label="Periodo">${bottoniG('periodo', [['30', '30 giorni'], ['90', '90 giorni'], ['tutto', 'Tutto']], periodoG)}</div>`;
  if (!G) return scelte + `<div class="nota">${esc(erroreG || 'Carico gli ordini P2P…')}</div>`;
  const leg = G.legami[metricaG], segno = r => (r > 0 ? '+' : r < 0 ? '−' : '') + fmtd(Math.abs(r), 2);
  return scelte + legenda([...LATI_G.map(([, nome, c]) => ({nome, colore: colore(c)})), {nome: 'Prezzo €', colore: colore('--sats')}])
    + `<div class="grafico" id="gP2P"></div>
    <div class="legami">${LATI_G.map(([lato, nome, c]) => { const x = leg[lato];
      return `<div><span class="pezzo" style="background:${colore(c)}"></span><b>${nome}</b>: ${esc(x.frase)} <span class="sub">· ${x.r == null ? '' : 'r ' + segno(x.r) + ' su '}${fmt(x.n)} ${piu(x.n, 'punto', 'punti')}</span></div>`; }).join('')}</div>
    <div class="nota">Si confrontano le variazioni, non i livelli. Un legame non è una causa.</div>`;
}
/* barre affiancate Compra/Vendi e la linea del prezzo sull'asse destro;
   un buco nel prezzo spezza la linea invece di inventare un tratto */
function graficoP2P(){
  const box = el('gP2P');
  /* a gruppo chiuso il riquadro e' largo zero: si disegna quando si apre */
  if (!box || !G || !box.offsetParent) return;
  misura(box);
  const pts = G.punti, n = pts.length, m = METRICHE_G.findIndex(x => x[0] === metricaG);
  const DXP = 44, area = W - SX - DXP, larg = area / Math.max(1, n);
  const t = tacche(Math.max(1, ...pts.map(p => Math.max(p.buy[m], p.sell[m])))), max = t[t.length - 1];
  const y = v => ALTO + (H - ALTO - BASSO) * (1 - v / max);
  const prezzi = pts.map(p => p.prezzo).filter(v => v > 0);
  const pmin = prezzi.length ? Math.min(...prezzi) * 0.98 : 0, pmax = prezzi.length ? Math.max(...prezzi) * 1.02 : 1;
  const yp = v => ALTO + (H - ALTO - BASSO) * (1 - (v - pmin) / ((pmax - pmin) || 1));
  const x = i => SX + i * larg;
  const b = Math.max(1, Math.min(10, (larg - 3) / 2));
  let svg = t.map(v => `<line x1="${SX}" x2="${W - DXP}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`
    + `<text x="${SX - 6}" y="${y(v) + 4}" text-anchor="end">${breve(v)}</text>`).join('');
  if (prezzi.length) [pmin / 0.98, (pmin + pmax) / 2, pmax / 1.02].forEach(v =>
    svg += `<text x="${W - DXP + 6}" y="${yp(v) + 4}" text-anchor="start">${breve(Math.round(v))}</text>`);
  const cBuy = colore('--trust'), cSell = colore('--rosso-p2p'), cPrezzo = colore('--sats');
  pts.forEach((p, i) => {
    const x0 = x(i) + (larg - 2 * b - 1) / 2;
    [[p.buy[m], cBuy, 0], [p.sell[m], cSell, b + 1]].forEach(([v, c, dx]) => {
      if (v) svg += `<rect x="${x0 + dx}" y="${y(v)}" width="${b}" height="${Math.max(1, y(0) - y(v))}" rx="${Math.min(2, b / 2)}" fill="${c}"/>`;
    });
  });
  let d = '', su = false;
  pts.forEach((p, i) => { if (p.prezzo > 0) { d += `${su ? 'L' : 'M'}${x(i) + larg / 2},${yp(p.prezzo)} `; su = true; } else su = false; });
  if (d) svg += `<path d="${d}" fill="none" stroke="${cPrezzo}" stroke-width="2" stroke-linejoin="round"/>`;
  const ogni = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(area / 70))));
  const giornoG = k => new Date(k + 'T00:00:00Z').toLocaleDateString('it-IT', {day: 'numeric', month: 'short', timeZone: 'UTC'});
  pts.forEach((p, i) => {
    if (!(i % ogni)) svg += `<text x="${x(i) + larg / 2}" y="${H - 8}" text-anchor="middle">${esc(giornoG(p.k))}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${x(i)}" y="${ALTO}" width="${larg}" height="${H - ALTO - BASSO}" fill="transparent"/>`;
  });
  monta(box, svg, i => { const p = pts[i];
    return {x: x(i) + larg / 2, y: y(Math.max(p.buy[m], p.sell[m])),
      testo: `${G.passo === 'settimana' ? 'sett. dal ' : ''}${esc(giornoG(p.k))} · Compra ${fmt(p.buy[m])} · Vendi ${fmt(p.sell[m])}${p.prezzo ? ' · € ' + fmt(Math.round(p.prezzo)) : ''}`}; });
}

      ${t(`Spediti entro ${h} ore`, fmt(A.spediti_entro) + ' su ' + fmt(A.spediti) + perc(A.spediti_entro, A.spediti), 'dal pagamento alla spedizione')}

/* ---- LA QUOTA DI SATS ROUTING (19 ott 2026): swap@barattolo.store ----
   Un wallet suo, «swap», separato dal salvadanaio degli zap e dalle
   cassaforti: il server ne ha la sola invoice key, qui si GUARDA. `S`
   nullo = indirizzo spento e mai un pagamento: niente card. Il commento
   lo scrive chi paga (swap@ lo puo' pagare chiunque): sempre `esc`. */
function cardSwap(S){
  if (!S) return '';
  const data = ts => ts ? new Date(ts * 1000).toLocaleString('it-IT', {day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}) : '—';
  return `<div class="card"><h2>🔄 Quota SATS Routing</h2>
    <div class="tiles">
      <div class="tile"><div class="k">Nel wallet «swap»</div><div class="v">${S.saldo_sats == null ? '—' : fmt(S.saldo_sats) + ' sats'}</div><div class="d">${S.saldo_sats == null ? 'LNbits non risponde' : 'saldo vivo'}</div></div>
      <div class="tile"><div class="k">Arrivati in tutto</div><div class="v">${fmt(S.totale_sats)} sats</div><div class="d">${fmt(S.quanti)} ${S.quanti === 1 ? 'pagamento' : 'pagamenti'}</div></div>
      <div class="tile"><div class="k">Indirizzo</div><div class="v" style="font-size:15px">${esc(S.indirizzo)}</div><div class="d">${S.vivo ? `acceso, fino a ${fmt(S.max_sats)} sats` : 'spento'}${S.in_attesa ? ` · ${fmt(S.in_attesa)} in attesa` : ''}</div></div>
    </div>
    <div class="tab">${tabella(['Quando', 'Sats', 'Messaggio'], (S.ultimi || []).map(u => [data(u.pagato_il), fmt(u.sats), esc(u.commento || '')]), [1])}</div>
    <div class="nota">Gli ultimi venti. Non sono zap e non sono garanzie: i sats si spostano a mano dal pannello di LNbits (wallet «swap»).</div>
  </div>`;
}

/* ---- IL VOLUME DEL CAMBIO (11 nov 2026, cantiere volume-cambio) ----
   (12 nov 2026: «Volume dello Swap», Andrea: «il riquadro chiamalo
   swap»; la pagina dal 12 nov si chiama «Swap».)
   Quanto hanno cambiato gli utenti nella pagina «Cambio»: per periodo, i
   cambi FATTI come li dice SATS Routing (la ronda degli esiti), quanti
   sats dal lato Lightning e quante persone diverse; per direzione, e
   accanto quanti sono ancora in corso e quanti non sono andati (fattura
   mai pagata, scaduti). `C` nullo = Cambio spento e nessun cambio: niente
   card. Solo numeri, niente nomi e niente indirizzi. */
function cardCambi(C, eurBtc){
  if (!C) return '';
  const eur = s => eurBtc > 0 && s ? `<div class="sub">≈ € ${fmtd(s / 1e8 * eurBtc, 0)}</div>` : '';
  const strada = x => `${fmt(x.fatti)} · ${fmt(x.sats)} sats`
    + (x.in_corso || x.non_andati ? `<div class="sub">${x.in_corso ? fmt(x.in_corso) + ' in corso' : ''}${x.in_corso && x.non_andati ? ' · ' : ''}${x.non_andati ? fmt(x.non_andati) + ' non andati' : ''}</div>` : '');
  const righe = (C.periodi || []).map(p => {
    const [lb, bl] = p.strade || [{}, {}];
    return [esc(p.nome), `${fmt(p.fatti)}<div class="sub">${fmt(p.persone)} ${p.persone === 1 ? 'persona' : 'persone'}</div>`,
      `${fmt(p.sats)}${eur(p.sats)}`, strada(lb), strada(bl)];
  });
  const sempre = (C.periodi || []).find(p => p.nome === 'da sempre') || {fatti: 0, sats: 0, persone: 0};
  return `<div class="card"><h2>🔁 Volume dello Swap</h2>
    <div class="tiles">
      <div class="tile"><div class="k">Swap da sempre</div><div class="v">${fmt(sempre.sats)} sats</div><div class="d">${fmt(sempre.fatti)} ${sempre.fatti === 1 ? 'swap fatto' : 'swap fatti'}, ${fmt(sempre.persone)} ${sempre.persone === 1 ? 'persona' : 'persone'}</div></div>
      <div class="tile"><div class="k">Pagina Swap</div><div class="v" style="font-size:15px">${C.attivo ? 'accesa' : 'spenta'}</div><div class="d">i numeri restano anche da spenta</div></div>
    </div>
    <div class="tab">${tabella(['Periodo', 'Fatti', 'Sats', '⚡→₿', '₿→⚡'], righe, [1, 2])}</div>
    <div class="nota">Contano gli swap che SATS Routing dice finiti bene: Lightning → bitcoin quando i bitcoin sono stati ritirati, bitcoin → Lightning quando la fattura dell'utente è stata pagata. I sats sono quelli dal lato Lightning. «In corso» sono gli swap di cui il servizio non ha ancora detto l'esito (si chiede ogni dieci minuti, per tre giorni); «non andati» sono fatture mai pagate o swap scaduti.</div>
  </div>`;
}

/* ---- DISPUTE P2P (12 ott 2026): quanti scambi con la garanzia
   bloccata finiscono in disputa ----
   La vedono tutti i moderatori: solo numeri, e delle aperte l'id
   dell'ordine accorciato. `X` nullo = un server senza P2P: niente card.
   IL DENOMINATORE sono gli scambi CON GARANZIA (`con_garanzia`): una
   disputa puo' nascere solo li'. Gli scambi presi restano in tabella,
   per confronto. Uno scambio sta nel periodo in cui e' stato PRESO e la
   disputa sta col suo scambio; la tendenza e' in PUNTI percentuali sul
   periodo prima, lungo uguale. Senza scambi con garanzia la percentuale
   e' «—», mai 0%. `X.dedotti` = gli scambi vecchi la cui garanzia e'
   ancora una deduzione; `X.escluse` = le dispute tolte a mano dal conto
   (leva P2P_DISPUTE_ESCLUSE), che la card NOMINA: un numero corretto a
   mano si deve vedere. */
const percD = p => p == null ? '—' : fmtd(p, 1) + '%';
function tendenzaD(p){
  if (!p.prima) return '—';
  if (p.tendenza == null) return '—';
  const segno = p.tendenza > 0 ? '▲ +' : p.tendenza < 0 ? '▼ −' : '= ';
  /* due righe corte: su un telefono la colonna e' larga ottanta pixel */
  return `<span style="white-space:nowrap">${segno}${fmtd(Math.abs(p.tendenza), 1)}</span><br><span class="sub" style="white-space:nowrap">era ${percD(p.prima.percento)}</span>`;
}
function cardDisputeP2P(X){
  if (!X) return '';
  const P7 = X.periodi['7'], P30 = X.periodi['30'], PT = X.periodi.tutto, S = X.soglia;
  const su = p => `${fmt(p.con_disputa)} ${p.con_disputa === 1 ? 'disputa' : 'dispute'} su ${fmt(p.con_garanzia)} ${p.con_garanzia === 1 ? 'scambio con garanzia' : 'scambi con garanzia'}`;
  const t = (k, v, d, rosso) => `<div class="tile"><div class="k">${k}</div><div class="v"${rosso ? ' style="color:var(--err)"' : ''}>${v}</div><div class="d">${d}</div></div>`;
  const giorni = ts => Math.max(0, Math.floor((Date.now() / 1000 - ts) / 86400));
  const aperte = X.aperte.map(a => `<span class="mono">${esc(a.ordine)}</span> <span class="sub">${giorni(a.aperta_il) ? 'da ' + fmt(giorni(a.aperta_il)) + ' g' : 'da oggi'}${a.presa ? '' : ', nessuno l\'ha presa'}</span>`).join(' · ');
  const riga = (nome, f) => [nome, f(P7, 7), f(P30, 30), f(PT, 0)];
  const dal = X.dal ? new Date(X.dal * 1000).toLocaleDateString('it-IT', {day: 'numeric', month: 'short', year: 'numeric'}) : '';
  return `<div class="card" id="disputeP2P"><h2>⚖️ Dispute P2P</h2>
    ${PT.presi ? `
    <div class="tiles">
      ${t('Ultimi 7 giorni', percD(P7.percento), su(P7))}
      ${t('Ultimi 30 giorni', percD(P30.percento), su(P30) + (S.sopra ? ' · sopra la soglia' : ''), S.sopra)}
      ${t('Da sempre', percD(PT.percento), su(PT))}
      ${t('Ancora aperte', fmt(X.aperte.length), aperte || 'nessuna')}
    </div>
    <div class="tab">${tabella(['', '7 giorni', '30 giorni', 'Da sempre'], [
      riga('Scambi presi', p => fmt(p.presi)),
      riga('Scambi con garanzia', p => fmt(p.con_garanzia)),
      riga('Con disputa', p => fmt(p.con_disputa)),
      riga('Percentuale', p => `<b>${percD(p.percento)}</b>`),
      riga('Punti sul periodo prima', tendenzaD),
      riga('Chiuse a favore di chi compra', p => fmt(p.compratore)),
      riga('Chiuse a favore di chi vende', p => fmt(p.venditore)),
      riga('Ancora aperte', p => fmt(p.aperte))])}</div>
    <div class="nota">La percentuale è sugli scambi con la garanzia bloccata, dove una disputa può nascere${X.dedotti ? `; per ${fmt(X.dedotti)} ${X.dedotti === 1 ? 'scambio più vecchio' : 'scambi più vecchi'} la garanzia è dedotta dal motivo` : ''}. Uno scambio conta nel periodo in cui è stato preso${dal ? ` («da sempre» parte dal ${esc(dal)})` : ''}. «A favore di» dice dove sono andati i sats: ${fmt(PT.moderatore)} su ${fmt(PT.compratore + PT.venditore)} le ha decise un moderatore, le altre si sono chiuse fra le parti o per scadenza.</div>
    ${(X.escluse || []).length ? `<div class="nota">${X.escluse.length === 1 ? 'Una disputa non contata' : fmt(X.escluse.length) + ' dispute non contate'} per scelta (leva P2P_DISPUTE_ESCLUSE): ${X.escluse.map(e => `<span class="mono">${esc(e)}</span>`).join(', ')}.</div>` : ''}
    <div class="nota">${S.percento > 0 ? `I moderatori ricevono un avviso se negli ultimi 30 giorni si passa il ${fmtd(S.percento, 1)}%, con almeno ${fmt(S.minimo)} dispute.` : 'L\'avviso ai moderatori è spento.'}</div>`
    : '<div class="nota">Ancora nessuno scambio preso.</div>'}
  </div>`;
}

function tabella(testa, righe, numeriche){
  /* una tabella VUOTA esce prima di tutto (10 ott 2026): `righe.length &&`
     dava 0, e `new Set(0)` alzava — su un giorno senza scambi P2P, o su
     un database appena nato, portandosi via la pagina intera */
  if (!righe.length) return '<div class="nota">Ancora niente.</div>';
  const num = new Set(numeriche || testa.map((_, i) => i).filter(i => i > 0));
  return `<table><thead><tr>${testa.map((h, i) => `<th class="${num.has(i) ? 'n' : ''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>`
    + righe.map(r => `<tr>${r.map((c, i) => `<td class="${num.has(i) ? 'n' : ''}">${c}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
/* un nodo: l'alias se c'e', la chiave accorciata, e il link per guardarlo */
function nodo(pub, alias){
  const p = String(pub || '');
  if (!/^[0-9a-f]{66}$/i.test(p)) return esc(alias || p || '—');
  const corto = p.slice(0, 8) + '…' + p.slice(-4);
  return (alias ? `<b>${esc(alias)}</b><br>` : '')
    + `<a class="mono" href="https://amboss.space/node/${p}" target="_blank" rel="noopener">${corto}</a>`;
}

/* ---- SCAMBI P2P (10 ott 2026): la sezione degli amministratori ----
   Ha il SUO periodo e la SUA richiesta: i numeri li fa il server per
   il periodo chiesto (`/api/admin/p2p-statistiche`), non questa pagina.
   Chi non e' amministratore qui non arriva — `D.p2p_statistiche` e'
   falso e la richiesta non parte — e se arrivasse lo stesso il server
   risponde 403 e il riquadro resta vuoto. */
let P = null, periodoP2P = 'oggi', reteP2P = 'tutti';
/* LE DUE RETI (16 nov 2026, Andrea: «nei completati si devono vedere tutti
   insieme», «poi posso filtrarli»): di serie i conti sommano Lightning e
   on-chain, e il filtro ne tiene una sola */
const RETI_P2P = [['tutti', 'Tutti'], ['ln', '⚡ Lightning'], ['oc', '₿ On-chain']];
const PERIODI_P2P = [['oggi', 'Oggi'], ['7', '7 giorni'], ['30', '30 giorni'], ['tutto', 'Tutto']];
const MOTIVI_P2P = {garanzia_non_pagata: 'garanzia non pagata', fattura_non_data: 'fattura non data',
  tempo_scaduto: 'tempo scaduto', garanzia_scaduta: 'garanzia arrivata a scadenza', tempo_pagare_scaduto: 'tempo per pagare finito',
  a_mano: 'annullato a mano', concordato: 'annullo concordato', moderatore: 'deciso da un moderatore',
  rimborsato: 'sats tornati a chi li aveva messi'};
const LATI_P2P = {sell: 'Vendi', buy: 'Compra'};
const ESITI_P2P = {completato: '✅ concluso', annullato: '❌ annullato', tornato: '🔄 tornato in vetrina'};
/* i sats col punto delle migliaia SEMPRE: l'italiano di serie non lo
   mette sotto le cinque cifre, e «4046 sats» accanto a «185.908» stona */
const fmtP = n => Number(n || 0).toLocaleString('it-IT', {useGrouping: 'always'});
const euro2 = n => '€ ' + Number(n || 0).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2});

async function caricaP2P(){
  const box = el('p2p');
  box.querySelectorAll('.filtri button[data-p]').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === periodoP2P));
  box.querySelectorAll('.filtri button[data-r]').forEach(b => b.setAttribute('aria-pressed', b.dataset.r === reteP2P));
  let r;
  try {
    r = await fetch('/api/admin/p2p-statistiche?periodo=' + encodeURIComponent(periodoP2P)
      + '&rete=' + encodeURIComponent(reteP2P),
      {credentials: 'same-origin', headers: {'X-Tg-Init-Data': intestazione()}});
  } catch(e) { r = null; }
  if (r && (r.status === 403 || r.status === 401)) { P = null; box.innerHTML = ''; return; }
  el('p2pBox').hidden = false;
  if (!r || !r.ok) {
    box.innerHTML = `<h1 style="margin-top:28px">🔁 Scambi P2P</h1><div class="stato">Non riesco a leggere i conti del P2P${r ? ` (il server ha risposto ${r.status})` : ''}: riprova fra poco.</div>`;
    return;
  }
  P = await r.json();
  disegnaP2P();
}

function disegnaP2P(){
  if (!P) return;
  const s = P.scambi, v = P.volume, c = P.commissioni, o = P.ordini, pe = P.persone, rt = c.routing;
  /* uno scambio, due scambi */
  const sc = n => n === 1 ? 'scambio' : 'scambi';
  const t = (k, val, d) => `<div class="tile"><div class="k">${k}</div><div class="v">${val}</div><div class="d">${d || ''}</div></div>`;
  const eurOra = sats => P.eur_per_btc > 0 ? `≈ ${euro2(sats / 1e8 * P.eur_per_btc)} al cambio di adesso` : '';
  const motivi = Object.entries(s.motivi || {}).sort((a, b) => b[1] - a[1])
    .map(([k, n]) => `${fmtP(n)} ${esc(MOTIVI_P2P[k] || k)}`).join(' · ');
  const gruppi = (righe, nome) => righe.map(g => [nome(g.nome), fmtP(g.scambi), g.euro ? euro2(g.euro) : '—', fmtP(g.sats)]);
  const fetta = (nome, f) => [nome, fmtP(f.meta), fmtP(f.sats), f.percento == null ? '—' : fmtd(f.percento, 2) + '%'];
  const fette = [fetta('A fee piena', c.fette.piena), fetta('Con sconto pionieri', c.fette.pioniere), fetta('Con sconto Lv5', c.fette.livello)];
  if (c.non_divise) fette.push(['Non divisibili (manca l\'importo dello scambio)', '—', fmtP(c.non_divise), '—']);
  const routing = rt.stato === 'ok' ? fmtP(rt.sats) + ' sats'
    : rt.stato === 'parziale' ? fmtP(rt.sats) + ' sats <span class="sub">parziale</span>' : 'non disponibile';
  const pr = c.per_rete || {ln: {scambi: 0, sats: 0}, oc: {scambi: 0, sats: 0}};
  const reteSola = P.rete === 'ln' || P.rete === 'oc';
  const diviseRete = reteSola ? '' : `⚡ Lightning ${fmtP(pr.ln.sats)} · ₿ on-chain ${fmtP(pr.oc.sats)} sats`;
  const routingD = !s.completati ? 'nessuno scambio concluso nel periodo'
    : rt.stato === 'ok' && !rt.abbinati ? 'gli scambi on-chain non pagano routing: l\'uscita sta nella transazione'
    : rt.stato === 'ok' ? rt.abbinati === 1 ? 'letto dal nodo' : `letto dal nodo per tutti e ${fmtP(rt.abbinati)} gli scambi`
    : rt.stato === 'parziale' ? `noto per ${fmtP(rt.abbinati)} ${sc(rt.abbinati)} su ${fmtP(s.completati)}: per gli altri non disponibile`
    : (P.lnd.stato === 'ok' ? 'il nodo risponde, ma non ha un pagamento che combaci' : esc(P.lnd.motivo || 'il nodo non risponde'));
  const quando = ts => ts ? new Date(ts * 1000).toLocaleString('it-IT', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '—';
  const esito = u => esc(ESITI_P2P[u.esito] || u.esito)
    + (u.esito === 'completato' ? (u.pagato ? '' : ' <span class="sub">pagamento in viaggio</span>')
       /* accanto a «annullato» il motivo perde la parola che lo ripete */
       : ` <span class="sub">${esc((MOTIVI_P2P[u.motivo] || u.motivo || '').replace(/^(annullato|annullo) /, ''))}</span>`);
  const chi = u => [u.pubblica, u.prende].map(x => esc(x || '—')).join(' → ');
  el('p2p').innerHTML = `
  <h1 style="margin-top:28px">🔁 Scambi P2P</h1>
  <div class="sub">Riservato agli amministratori · conti aggiornati alle ${new Date(P.generato * 1000).toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'})}</div>
  <div class="filtri" role="group" aria-label="Periodo degli scambi P2P">
    ${PERIODI_P2P.map(([p, nome]) => `<button data-p="${p}" aria-pressed="${p === P.periodo}" onclick="periodoP2P='${p}';caricaP2P()">${nome}</button>`).join('')}
  </div>
  <div class="filtri" role="group" aria-label="Rete degli scambi P2P">
    ${RETI_P2P.map(([r, nome]) => `<button data-r="${r}" aria-pressed="${r === (P.rete || 'tutti')}" onclick="reteP2P='${r}';caricaP2P()">${nome}</button>`).join('')}
  </div>

  <div class="card"><h2>Scambi</h2>
    <div class="tiles">
      ${t('Completati', fmtP(s.completati), (reteSola ? '' : `⚡ ${fmtP(pr.ln.scambi)} · ₿ ${fmtP(pr.oc.scambi)} · `) + (s.in_viaggio ? `${fmtP(s.in_viaggio)} col pagamento a chi compra ancora in viaggio` : 'sats arrivati a chi compra'))}
      ${t('Annullati', fmtP(s.annullati), (motivi || 'nessuno') + (s.tornati ? ` — ${fmtP(s.tornati)} con l'ordine tornato in vetrina` : ''))}
      ${t('In corso adesso', fmtP(s.in_corso), (s.in_disputa ? `${fmtP(s.in_disputa)} in disputa · ` : '') + 'non dipende dal periodo')}
      ${t('Tasso di completamento', s.tasso == null ? '—' : fmtd(s.tasso, 1) + '%', 'completati su chiusi (completati + annullati)')}
    </div>
  </div>

  <div class="card"><h2>Volume</h2>
    <div class="tiles">
      ${t('Euro scambiati', euro2(v.euro), v.senza_euro ? `${fmtP(v.senza_euro)} ${sc(v.senza_euro)} senza cifra in euro (ordini di altri client, o in USDT e franchi)` : 'la cifra del libro, scambi conclusi')}
      ${t('Sats passati', fmtP(v.sats), eurOra(v.sats))}
      ${t('Scambio medio', s.completati - v.senza_euro > 0 ? euro2(v.euro / (s.completati - v.senza_euro)) : '—', s.completati ? fmtP(Math.round(v.sats / s.completati)) + ' sats in media' : '')}
    </div>
    <h2 style="margin-top:14px">Per tipo di ordine</h2>
    <div class="tab">${tabella(['Tipo', 'Scambi', 'Euro', 'Sats'], gruppi(v.lati, n => esc(LATI_P2P[n] || 'Non noto')))}</div>
    <h2 style="margin-top:14px">Per metodo di pagamento</h2>
    <div class="tab">${tabella(['Metodo', 'Scambi', 'Euro', 'Sats'], gruppi(v.metodi, n => esc(n || 'Non noto')))}</div>
    <div class="nota">«Vendi» e «Compra» sono dal lato di chi ha pubblicato l'ordine. Un ordine con più metodi sta in una riga sua: quale dei due sia stato usato lo sanno solo le due parti.</div>
  </div>

  <div class="card"><h2>Commissioni</h2>
    <div class="tiles">
      ${t('Incassate', fmtP(c.lorde_sats) + ' sats', [c.lorde_sats ? `≈ ${euro2(c.euro)} al cambio del momento${c.senza_cambio ? ` (${fmtP(c.senza_cambio)} ${sc(c.senza_cambio)} senza cambio)` : ''}` : '', diviseRete].filter(Boolean).join('<br>'))}
      ${t('Routing dei payout', routing, routingD)}
      ${t('Nette', c.nette_sats == null ? '—' : fmtP(c.nette_sats) + ' sats', c.nette_sats == null ? 'servono le fee di routing di tutti gli scambi' : 'incassate meno il routing')}
    </div>
    <div class="tab">${tabella(['Come è stata pagata', 'Metà', 'Sats', '% sullo scambio'], fette)}</div>
    <div class="nota">Ogni scambio ha due metà di commissione: una di chi vende, una di chi compra. Quelle on-chain vanno alla chiave di Barattolo (la terza del 2-di-3), un indirizzo nuovo per ogni scambio; prima del 16 novembre 2026 l'on-chain non prendeva commissione.${c.senza_importi ? ` ${fmtP(c.senza_importi)} ${c.senza_importi === 1 ? 'scambio concluso non porta' : 'scambi conclusi non portano'} gli importi di chiusura e qui non ${c.senza_importi === 1 ? 'entra' : 'entrano'}.` : ''}</div>
  </div>

  <div class="card"><h2>Ordini</h2>
    <div class="tiles">
      ${t('Pubblicati', fmtP(o.pubblicati), 'da Barattolo' + (o.a_intervallo ? ` · ${fmtP(o.a_intervallo)} a intervallo` : ''))}
      ${t('Presi', fmtP(o.presi), 'le prese raccontate dal coordinatore')}
      ${t('Scaduti senza essere presi', fmtP(o.scaduti), o.ritirati ? `${fmtP(o.ritirati)} ${o.ritirati === 1 ? 'ritirato' : 'ritirati'} da chi li aveva pubblicati` : 'nessuno ritirato a mano')}
      ${t('Importo medio', o.importo_medio == null ? '—' : euro2(o.importo_medio), 'degli ordini pubblicati a cifra fissa')}
    </div>
  </div>

  <div class="card"><h2>Persone</h2>
    <div class="tiles">
      ${t('Utenti diversi', fmtP(pe.diverse), 'con almeno uno scambio concluso nel periodo')}
      ${t('Nuovi', fmtP(pe.nuove), 'al primo scambio concluso nel periodo')}
      ${pe.parti_ignote ? t('Parti non riconosciute', fmtP(pe.parti_ignote), 'altri client, o chiavi che il server non conosce') : ''}
    </div>
  </div>

  <div class="card"><h2>Ultimi scambi${P.ultimi.length ? ` (${fmtP(P.ultimi.length)})` : ''}</h2>
    <div class="tab">${tabella(['Data', 'Rete', 'Ordine', 'Tipo', 'Importo', 'Sats', 'Metodo', 'Esito', 'Commissione', 'Routing', 'Pubblica → prende'],
      P.ultimi.map(u => [quando(u.quando), u.rete === 'oc' ? '₿' : '⚡', `<span class="mono">${esc(u.ordine)}</span>`, esc(LATI_P2P[u.lato] || '—'),
        u.euro ? euro2(u.euro) : '—', u.sats ? fmtP(u.sats) : '—', esc(u.metodi || '—'), esito(u),
        u.commissione == null ? '—' : fmtP(u.commissione), u.routing == null ? '—' : fmtP(u.routing), chi(u)]), [4, 5, 8, 9])}</div>
    <div class="nota">Al posto dei nomi le iniziali, o le ultime tre cifre dell'id per chi un nome non ce l'ha. «—» è chi il server non conosce, o non ricorda più.</div>
    <details><summary>Cosa è certo e cosa è una stima</summary>
      <div class="nota"><b>Certo</b> (lo dice il coordinatore): quanti scambi, i loro passi e le ore; i tre importi di chiusura — lo scambio, il netto a chi compra, il totale bloccato da chi vende — e quindi le commissioni incassate.</div>
      <div class="nota"><b>Certo ma parziale</b>: euro, metodo e tipo vengono dal libro, che il server segue per gli ordini con almeno un account di Barattolo; gli ordini «pubblicati» sono quelli pubblicati da qui; le persone sono quelle che il libro ha intestato (chi prende da Nostr senza farsi riconoscere non si conta).</div>
      <div class="nota"><b>Dedotto</b>: il motivo di un annullo per scadenza (quale gesto mancava nella cronaca); la divisione fra fee piena e scontata (chi aveva diritto allo sconto secondo Barattolo, mentre la cifra l'ha applicata il coordinatore); il routing, che è la fee vera letta dal nodo ma abbinata allo scambio per importo e ora.</div>
      <div class="nota"><b>Stima</b>: gli euro delle commissioni (sats per il cambio della presa) e ogni «≈ al cambio di adesso».</div>
    </details>
  </div>`;
}

/* ===== 💰 I GUADAGNI E LE SPESE (27 nov 2026, cantiere cruscotto-guadagni) =====
   Andrea: «vorrei immediatamente vedere i guadagni, cosa fondamentale. E
   anche monitorare le spese». Sotto le tre domande: quanto entra, da
   dove (mercatino, P2P, SATS Routing, zap, Bitcoin Labs, altro), quanto
   esce, e la differenza; poi volumi e commissioni. I numeri li da'
   `/api/admin/guadagni`, solo agli amministratori (lo stesso giudice dei
   conti P2P): a chi non lo e' la sezione non nasce. Le voci a mano
   (Bitcoin Labs, le spese) si scrivono qui sotto. */
let GU = null, erroreGU = '', periodoGU = 30, cancellaGU = 0;
const FONTI_GU = [
  [3, 'Mercatino', '--f-merc'], [4, 'P2P', '--f-p2p'], [5, 'SATS Routing', '--f-rout'],
  [6, 'Zap', '--f-zap'], [7, 'Bitcoin Labs', '--f-labs'], [8, 'Altro', '--f-altro']];
const RICORRENZE_GU = {una: 'una volta', mese: 'ogni mese', anno: 'ogni anno'};
async function caricaGuadagni(){
  erroreGU = '';
  try {
    const r = await fetch('/api/admin/guadagni', {credentials: 'same-origin',
      headers: {'X-Tg-Init-Data': intestazione()}});
    if (!r.ok) throw new Error(r.status);
    GU = await r.json();
  } catch(e) { GU = null; erroreGU = 'Non riesco a leggere i guadagni: riprova fra poco.'; }
  ridisegnaGuadagni();
}
function ridisegnaGuadagni(){
  const box = el('sezGuadagni');
  if (box) { box.innerHTML = sezioneGuadagni(); graficiGuadagni(); }
}
const granGU = () => periodoGU && periodoGU <= 31 ? 'giorno' : (periodoGU && periodoGU <= 180 ? 'settimana' : 'mese');
const oggiGU = () => new Date().toISOString().slice(0, 10);
const inizioGU = () => !periodoGU ? ((GU.giorni[0] || [])[0] || oggiGU())
  : new Date(Date.now() - (periodoGU - 1) * GIORNO).toISOString().slice(0, 10);
function secchiGU(){
  const modo = granGU(), out = [], visti = new Set();
  for (let t = new Date(inizioGU() + 'T00:00:00Z').getTime(); t <= Date.now(); t += GIORNO) {
    const k = chiave(new Date(t).toISOString().slice(0, 10), modo);
    if (!visti.has(k)) { visti.add(k); out.push(k); }
  }
  return out;
}
/* i secchi del periodo: per ognuno le nove colonne del server */
function sommaGU(){
  const modo = granGU(), da = inizioGU(), m = {};
  for (const r of GU.giorni) {
    if (r[0] < da) continue;
    const v = m[chiave(r[0], modo)] || (m[chiave(r[0], modo)] = Array(9).fill(0));
    for (let i = 0; i < 9; i++) v[i] += r[i + 1];
  }
  return m;
}
const euroGU = s => GU.eur_per_btc > 0 ? '≈ € ' + fmtd(s / 1e8 * GU.eur_per_btc, 0) : '';
const importoGU = m => m.valuta === 'eur' ? euro2(m.importo / 100) : fmt(m.importo) + ' sats';
function sezioneGuadagni(){
  if (!D || !D.p2p_statistiche) return '';
  const titolo = '<div class="sez">💰 Guadagni</div>';
  if (!GU) return titolo + `<div class="riquadro"><div class="nota" style="margin:0">${esc(erroreGU || 'Carico i guadagni…')}</div></div>`;
  const per = sommaGU(), tot = Array(9).fill(0);
  Object.values(per).forEach(v => v.forEach((x, i) => tot[i] += x));
  const entrate = FONTI_GU.reduce((a, [c]) => a + tot[c - 1], 0), spese = tot[8], netto = entrate - spese;
  const periodo = periodoGU ? `negli ultimi ${periodoGU} giorni` : 'da sempre';
  const fonti = FONTI_GU.map(([c, nome, col]) => [nome, tot[c - 1], colore(col)]).sort((a, b) => b[1] - a[1]);
  return titolo + `
  <div class="scelte" role="group" aria-label="Periodo dei guadagni">
    ${[[30, '30 giorni'], [90, '90 giorni'], [365, 'Un anno'], [0, 'Sempre']].map(([g, t]) =>
      `<button aria-pressed="${g === periodoGU}" onclick="periodoGU=${g};ridisegnaGuadagni()">${t}</button>`).join('')}
  </div>
  <div class="carte" style="margin-top:10px">
    ${carta(breve(entrate), `sats guadagnati ${esc(periodo)}<br>${euroGU(entrate)}`, entrate ? 'bene' : '')}
    ${carta(breve(spese), `sats di spese<br>${euroGU(spese)}`, spese ? 'guarda' : '')}
  </div>
  <div class="carte" style="grid-template-columns:1fr;margin-top:10px">
    ${carta((netto < 0 ? '−' : '') + breve(Math.abs(netto)) + ' sats', `guadagni meno spese ${euroGU(Math.abs(netto)) ? '· ' + (netto < 0 ? '−' : '') + euroGU(Math.abs(netto)) : ''}`, netto < 0 ? 'urgente' : netto > 0 ? 'bene' : '')}
  </div>
  <div class="riquadro" style="margin-top:10px">
    <div style="font-weight:800">Guadagni per ${granGU()}</div>
    ${legenda(FONTI_GU.map(([, nome, col]) => ({nome, colore: colore(col)})))}
    <div class="grafico" id="gGuadagni"></div>
    <div style="font-weight:800;margin-top:12px">Da dove arrivano</div>
    <div class="fonti">${fonti.map(([nome, s, col]) => `<div class="fonte">
      <span class="pezzo" style="background:${col}"></span><b>${esc(nome)}</b>
      <span>${fmt(s)} sats <span class="sub">${entrate ? fmtd(s / entrate * 100, 0) + '%' : '—'}</span></span>
      <div class="barra" style="grid-column:1/-1"><b style="width:${entrate ? s / entrate * 100 : 0}%;background:${col}"></b></div></div>`).join('')}</div>
    <div class="nota">Mercatino: protezione e commissione degli ordini conclusi (la commissione di oggi è ${fmtd(GU.commissione_percento, 2)}%). P2P: le commissioni lorde degli scambi conclusi, Lightning e on-chain. SATS Routing: la quota arrivata a swap@. Zap: il salvadanaio. Bitcoin Labs e «altro» si scrivono a mano qui sotto: se un referral arriva già sull'indirizzo degli zap, non scriverlo due volte.</div>
  </div>
  <div class="riquadro" style="margin-top:10px">
    <div style="font-weight:800">Volumi e commissioni per ${granGU()}</div>
    ${legenda([{nome: 'Volume mercatino', colore: colore('--f-merc')}, {nome: 'Volume P2P', colore: colore('--f-p2p')}, {nome: 'Commissioni (asse destro)', colore: colore('--sats')}])}
    <div class="grafico" id="gVolumiGU"></div>
    <div class="nota">Volume ${esc(periodo)}: ${fmt(tot[0] + tot[1])} sats (${fmt(tot[0])} mercatino · ${fmt(tot[1])} P2P). Commissioni: ${fmt(tot[2] + tot[3])} sats${tot[0] + tot[1] ? ', il ' + fmtd((tot[2] + tot[3]) / (tot[0] + tot[1]) * 100, 2) + '% del volume' : ''}.</div>
  </div>
  ${sezioneSpese()}`;
}
/* LE SPESE E LE VOCI A MANO: l'elenco, il conto delle fisse al mese e il
   modulo. La voce e' testo di un admin: passa da esc() come ogni altro. */
function sezioneSpese(){
  const mov = GU.movimenti || [], attiva = m => m.ricorrenza !== 'una' && !m.fine;
  const alMese = m => (m.valuta === 'eur' ? m.importo / 100 : (GU.eur_per_btc > 0 ? m.importo / 1e8 * GU.eur_per_btc : 0)) / (m.ricorrenza === 'anno' ? 12 : 1);
  const fisse = mov.filter(m => m.verso === 'spesa' && attiva(m)).reduce((a, m) => a + alMese(m), 0);
  const nome = m => m.verso === 'spesa' ? '💸' : m.fonte === 'bitcoin_labs' ? '🎓 Bitcoin Labs ·' : '➕';
  const quando = m => m.ricorrenza === 'una' ? `il ${esc(m.giorno)}`
    : `${RICORRENZE_GU[m.ricorrenza]} dal ${esc(m.giorno)}${m.fine ? ` · ferma dal ${esc(m.fine)}` : ''}`;
  return `<div class="sez">💸 Spese e voci a mano</div>
  <div class="riquadro">
    ${fisse ? `<div class="nota" style="margin:0 0 6px">Spese fisse attive: <b>${euro2(fisse)} al mese</b> (gli abbonamenti annuali divisi per dodici).</div>` : ''}
    ${mov.length ? `<div class="salute" style="box-shadow:none;border:0;padding:0">${mov.map(m => `<div class="riga" style="flex-wrap:wrap">
      <b style="min-width:0;flex:1">${nome(m)} ${esc(m.voce)}<div class="nota" style="margin:0;font-weight:600">${quando(m)}</div></b>
      <span style="margin-left:0">${m.verso === 'spesa' ? '−' : '+'}${importoGU(m)}</span>
      <span class="azioni">${attiva(m) ? `<button onclick="fermaCassa(${+m.id})">Ferma</button>` : ''}<button onclick="cancellaCassa(${+m.id}, this)">✕</button></span>
    </div>`).join('')}</div>` : '<div class="nota" style="margin:0 0 6px">Nessuna voce ancora: aggiungi qui gli abbonamenti (Claude, server, API…) e le entrate di Bitcoin Labs.</div>'}
    <form id="formCassa" class="modulo" onsubmit="event.preventDefault();aggiungiCassa()">
      <select name="tipo" aria-label="Tipo"><option value="spesa">💸 Spesa</option><option value="bitcoin_labs">🎓 Entrata Bitcoin Labs</option><option value="altro">➕ Altra entrata</option></select>
      <input name="voce" maxlength="60" placeholder="Di cosa si tratta (es. Claude Max)" required>
      <div class="due"><input name="importo" inputmode="decimal" placeholder="Importo" required>
        <select name="valuta" aria-label="Valuta"><option value="eur">€</option><option value="sats">sats</option></select></div>
      <div class="due"><select name="ricorrenza" aria-label="Quanto spesso"><option value="una">Una volta</option><option value="mese">Ogni mese</option><option value="anno">Ogni anno</option></select>
        <input name="giorno" type="date" value="${oggiGU()}" aria-label="Dal giorno" required></div>
      <div class="scelte"><button type="submit" aria-pressed="true">Aggiungi</button></div>
      <div class="nota" id="esitoCassa" style="margin:4px 0 0"></div>
    </form>
  </div>`;
}
async function chiamaCassa(metodo, url, corpo){
  const r = await fetch(url, {method: metodo, credentials: 'same-origin',
    headers: {'X-Tg-Init-Data': intestazione(), 'Content-Type': 'application/json'},
    body: corpo ? JSON.stringify(corpo) : undefined});
  if (!r.ok) { let t = ''; try { t = (await r.json()).detail; } catch(e) {} throw new Error(t || `il server ha risposto ${r.status}`); }
}
async function aggiungiCassa(){
  const f = el('formCassa'), v = n => f.elements[n].value, tipo = v('tipo');
  try {
    await chiamaCassa('POST', '/api/admin/cassa', {verso: tipo === 'spesa' ? 'spesa' : 'entrata',
      fonte: tipo === 'spesa' ? '' : tipo, voce: v('voce'), importo: v('importo'),
      valuta: v('valuta'), ricorrenza: v('ricorrenza'), giorno: v('giorno')});
  } catch(e) { el('esitoCassa').textContent = '⚠️ ' + e.message; return; }
  await caricaGuadagni();
}
async function fermaCassa(id){
  try { await chiamaCassa('POST', `/api/admin/cassa/${id}/ferma`); } catch(e) {}
  await caricaGuadagni();
}
/* due tocchi per cancellare: il primo chiede, il secondo cancella (niente
   finestre del browser, che dentro Telegram si comportano male) */
async function cancellaCassa(id, b){
  if (cancellaGU !== id) { cancellaGU = id; b.textContent = 'Sicuro?'; return; }
  cancellaGU = 0;
  try { await chiamaCassa('DELETE', `/api/admin/cassa/${id}`); } catch(e) {}
  await caricaGuadagni();
}
function graficiGuadagni(){
  const g = el('gGuadagni');
  if (!g || !GU) return;
  const ks = secchiGU(), modo = granGU(), per = sommaGU();
  const val = {}; Object.keys(per).forEach(k => val[k] = FONTI_GU.map(([c]) => per[k][c - 1]));
  barre(g, ks, FONTI_GU.map(([, nome, col]) => ({nome, colore: colore(col)})), val, (k, v) => {
    const parti = FONTI_GU.map(([, nome], i) => v[i] ? `${nome} ${fmt(v[i])}` : '').filter(Boolean);
    return `${esc(etichetta(k, modo))} · ${fmt(v.reduce((a, b) => a + b, 0))} sats${parti.length ? '<br>' + parti.map(esc).join(' · ') : ''}`;
  }, modo);
  volumiCommissioni(el('gVolumiGU'), ks, per, modo);
}
/* barre impilate dei volumi (mercatino, P2P) e la linea delle commissioni
   sull'asse destro, come il grafico ordini P2P / prezzo */
function volumiCommissioni(box, ks, per, modo){
  if (!box) return;
  misura(box);
  const n = ks.length, DXP = 44, area = W - SX - DXP, larg = area / Math.max(1, n);
  const v = k => per[k] || Array(9).fill(0);
  const t = tacche(Math.max(1, ...ks.map(k => v(k)[0] + v(k)[1]))), max = t[t.length - 1];
  const tc = tacche(Math.max(1, ...ks.map(k => v(k)[2] + v(k)[3]))), maxc = tc[tc.length - 1];
  const y = x => ALTO + (H - ALTO - BASSO) * (1 - x / max), yc = x => ALTO + (H - ALTO - BASSO) * (1 - x / maxc);
  const x = i => SX + i * larg, b = Math.max(2, Math.min(28, larg - 4));
  let svg = t.map(q => `<line x1="${SX}" x2="${W - DXP}" y1="${y(q)}" y2="${y(q)}" stroke="var(--grid)" stroke-width="1"/>`
    + `<text x="${SX - 6}" y="${y(q) + 4}" text-anchor="end">${breve(q)}</text>`).join('');
  tc.forEach(q => svg += `<text x="${W - DXP + 6}" y="${yc(q) + 4}" text-anchor="start">${breve(q)}</text>`);
  const cM = colore('--f-merc'), cP = colore('--f-p2p'), cC = colore('--sats');
  ks.forEach((k, i) => {
    const [vm, vp] = v(k), xx = x(i) + (larg - b) / 2;
    if (vm) svg += `<rect x="${xx}" y="${y(vm)}" width="${b}" height="${Math.max(1, y(0) - y(vm))}" fill="${cM}"/>`;
    if (vp) svg += `<rect x="${xx}" y="${y(vm + vp)}" width="${b}" height="${Math.max(1, y(vm) - y(vm + vp) - (vm ? 2 : 0))}" fill="${cP}"/>`;
  });
  svg += `<polyline fill="none" stroke="${cC}" stroke-width="2" stroke-linejoin="round" points="${ks.map((k, i) => `${x(i) + larg / 2},${yc(v(k)[2] + v(k)[3])}`).join(' ')}"/>`;
  ks.forEach((k, i) => svg += `<rect class="hit" data-i="${i}" x="${x(i)}" y="${ALTO}" width="${larg}" height="${H - ALTO - BASSO}" fill="transparent"/>`);
  svg += assex(ks, x, larg, modo);
  monta(box, svg, i => { const q = v(ks[i]);
    return {x: x(i) + larg / 2, y: Math.min(y(q[0] + q[1]), yc(q[2] + q[3])),
      testo: `${esc(etichetta(ks[i], modo))} · volume ${fmt(q[0] + q[1])} sats<br>mercatino ${fmt(q[0])} · P2P ${fmt(q[1])} · commissioni ${fmt(q[2] + q[3])}`}; });
}

let ridisegno = 0;
/* chi sta scrivendo una voce non si vede ridisegnare il modulo in faccia:
   sul telefono la tastiera che si apre e' un resize */
addEventListener('resize', () => { if (!D || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#formCassa'))) return; clearTimeout(ridisegno); ridisegno = setTimeout(disegna, 150); });
carica();
</script>
