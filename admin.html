<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cruscotto Barattolo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face{font-family:'Baloo 2';font-weight:800;font-display:swap;src:url(/vendor/font/baloo2-latin.woff2) format('woff2')}
  @font-face{font-family:'Nunito';font-weight:400 600 700 800;font-display:swap;src:url(/vendor/font/nunito-latin.woff2) format('woff2')}
  :root{
    --bg:#211A10; --card:#2C2517; --ink:#F1E8D5; --muted:#A99F87; --soft:#B5AA90;
    --line:#3E3623; --grid:#3a3121;
    --sats:#F7931A; --sats-soft:#3E2B12; --sats-text:#FFB25C;
    --ok:#34B47A; --ok-soft:#1B2C20; --ok-text:#63CB96;
    --rosso-p2p:#F26E4E; --rosso-p2p-soft:#3D2017; --rosso-p2p-text:#F37456;
    --radius:16px; --shadow:0 1px 4px rgba(0,0,0,.35);
    --shadow-hover:0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:15px;line-height:1.5}
  html{height:100%;overscroll-behavior:none}
  body{height:100%;overscroll-behavior:none}
  main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
  h1{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:36px;margin-bottom:4px;color:var(--ink)}
  h2{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:20px;margin:20px 0 12px;color:var(--ink)}
  h3{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;margin:0;color:var(--ink)}
  .sub{color:var(--muted);font-weight:600;font-size:13px}

  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
  .header-left h1{margin:0}
  .header-right{text-align:right}

  .periodo{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  .periodo button{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer;transition:all .15s}
  .periodo button:hover{border-color:var(--sats);color:var(--sats)}
  .periodo button[aria-pressed="true"]{background:var(--sats);color:#000;border-color:var(--sats)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:16px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);transition:all .15s}
  .card:hover{border-color:var(--sats);box-shadow:var(--shadow-hover)}

  .kpi{padding:4px 0}
  .kpi-label{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .kpi-value{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:32px;margin:8px 0;color:var(--sats);line-height:1.1}
  .kpi-subtext{color:var(--soft);font-weight:600;font-size:13px}

  .chart-container{position:relative;width:100%;margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .chart-title{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;font-size:16px;margin-bottom:16px;color:var(--ink)}
  .chart-svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-svg text{fill:var(--muted);font:600 11px 'Nunito',system-ui,sans-serif}

  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}
  .legend-item{display:flex;align-items:center;gap:6px;color:var(--soft);font-weight:700}
  .legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px}

  .tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  .tooltip.on{opacity:1}

  .details{margin-top:20px}
  .details-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:8px 0;user-select:none;font-weight:700;color:var(--soft);font-size:14px;transition:color .15s}
  .details-header:hover{color:var(--sats)}
  .details-header::after{content:'▼';transition:transform .15s;margin-left:8px}
  .details.closed .details-header::after{transform:rotate(-90deg)}
  .details.closed .details-content{display:none}
  .details-content{margin-top:12px}

  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  td.num,th.num{text-align:right}

  .note{color:var(--soft);font-weight:600;font-size:13px;margin-top:12px;line-height:1.5}
  .error{background:var(--rosso-p2p-soft);border:1px solid var(--rosso-p2p);color:var(--rosso-p2p-text);padding:12px;border-radius:var(--radius);margin:12px 0}

  @media (max-width:768px){
    main{padding:16px 12px 40px}
    h1{font-size:28px}
    .grid{grid-template-columns:1fr}
    .kpi-value{font-size:24px}
  }
</style>
</head>
<body>
<main>
  <div class="header">
    <div class="header-left">
      <h1>📊 Cruscotto</h1>
      <div class="sub" id="sub">Carico i dati…</div>
    </div>
  </div>

  <div class="periodo" role="group" aria-label="Seleziona periodo">
    <button aria-pressed="true" onclick="setPeriodo(30)">30 giorni</button>
    <button onclick="setPeriodo(90)">90 giorni</button>
    <button onclick="setPeriodo(365)">Un anno</button>
    <button onclick="setPeriodo(0)">Da sempre</button>
  </div>

  <div id="corpo"></div>
</main>

<script>
const tg = window.Telegram?.WebApp;
try { if (tg?.colorScheme) document.documentElement.dataset.theme = tg.colorScheme; } catch(e){}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('it-IT');
const fmtd = (n, d) => Number(n || 0).toLocaleString('it-IT', {maximumFractionDigits: d});

let D = null, giorni = 30;

function setPeriodo(g) {
  giorni = g;
  document.querySelectorAll('.periodo button').forEach((b, i) => {
    const val = [30, 90, 365, 0][i];
    b.setAttribute('aria-pressed', g === val);
  });
  carica();
}

async function carica() {
  try {
    const r = await fetch('/api/admin/cruscotto', {
      credentials: 'same-origin',
      headers: {'X-Tg-Init-Data': intestazione()}
    });
    if (r.status === 401) return errore('Entra prima su Barattolo, poi torna qui.');
    if (r.status === 403) return errore('Questa pagina è solo per admin.');
    if (!r.ok) return errore(`Errore ${r.status}`);

    D = await r.json();
    document.getElementById('sub').textContent = 'Aggiornato alle ' +
      new Date(D.generato * 1000).toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
    disegna();
  } catch(e) {
    errore('Non riesco a contattare il server.');
  }
}

function intestazione() {
  if (tg?.initData) return tg.initData;
  const c = new URLSearchParams(location.search).get('collaudo');
  return /^\d{1,6}$/.test(c || '') ? `collaudo:${c}:Admin` : '';
}

function errore(t) {
  document.getElementById('corpo').innerHTML = `<div class="error">${esc(t)}</div>`;
}

function disegna() {
  const it = D.iscritti_totali, vt = D.volume_totale;
  const periodo = giorni ? `negli ultimi ${giorni} giorni` : 'da sempre';
  const nuoviPer = D.iscritti.filter(r => r[0] >= dataInizio()).reduce((a, v) => [a[0] + v[1], a[1] + v[2]], [0, 0]);
  const vendPer = D.volume.filter(r => r[0] >= dataInizio()).reduce((a, v) => [a[0] + v[0], a[1] + v[1], a[2] + v[2]], [0, 0, 0]);

  document.getElementById('corpo').innerHTML = `
    <div class="grid">
      <div class="card">
        <div class="kpi">
          <div class="kpi-label">Iscritti totali</div>
          <div class="kpi-value">${fmt(it.totale)}</div>
          <div class="kpi-subtext">${fmt(it.telegram)} TG · ${fmt(it.nostr)} Nostr</div>
        </div>
      </div>
      <div class="card">
        <div class="kpi">
          <div class="kpi-label">Nuovi ${esc(periodo)}</div>
          <div class="kpi-value">${fmt(nuoviPer[0] + nuoviPer[1])}</div>
          <div class="kpi-subtext">${fmt(nuoviPer[0])} TG · ${fmt(nuoviPer[1])} Nostr</div>
        </div>
      </div>
      <div class="card">
        <div class="kpi">
          <div class="kpi-label">Sats venduti (totale)</div>
          <div class="kpi-value">${fmt(vt.sats)}</div>
          <div class="kpi-subtext">${fmt(vt.ordini)} ordini</div>
        </div>
      </div>
      <div class="card">
        <div class="kpi">
          <div class="kpi-label">Sats venduti ${esc(periodo)}</div>
          <div class="kpi-value">${fmt(vendPer[1])}</div>
          <div class="kpi-subtext">${fmt(vendPer[0])} ordini</div>
        </div>
      </div>
    </div>

    <h2>Iscritti nel tempo</h2>
    <div class="chart-container">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--sats)"></span> Telegram</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--ok-text)"></span> Nostr</div>
      </div>
      <div id="chartIscritti" class="chart-container" style="background:transparent;border:none;padding:0;margin:0;box-shadow:none"></div>
    </div>

    <h2>Fee di routing nel tempo</h2>
    <div class="chart-container">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--sats)"></span> Fee (sats)</div>
      </div>
      <div id="chartFee" class="chart-container" style="background:transparent;border:none;padding:0;margin:0;box-shadow:none"></div>
    </div>

    <h2>Volumi nel tempo</h2>
    <div class="chart-container">
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--sats)"></span> Sats venduti</div>
      </div>
      <div id="chartVolume" class="chart-container" style="background:transparent;border:none;padding:0;margin:0;box-shadow:none"></div>
    </div>
  `;

  disegnaGrafici();
}

function dataInizio() {
  if (!giorni) return '2000-01-01';
  return new Date(Date.now() - (giorni - 1) * 86400000).toISOString().slice(0, 10);
}

function disegnaGrafici() {
  const modo = giorni <= 31 ? 'giorno' : (giorni <= 180 ? 'settimana' : 'mese');
  const ks = secchi(modo);

  const nuovi = aggregaIscritti(modo, ks);
  const fee = aggregaFee(modo, ks);
  const vend = aggregaVolume(modo, ks);

  grafico(document.getElementById('chartIscritti'), ks, modo, nuovi, [
    {nome: 'Telegram', colore: 'var(--sats)'},
    {nome: 'Nostr', colore: 'var(--ok-text)'}
  ]);

  grafico(document.getElementById('chartFee'), ks, modo, fee, [
    {nome: 'Fee', colore: 'var(--sats)'}
  ]);

  grafico(document.getElementById('chartVolume'), ks, modo, vend, [
    {nome: 'Sats', colore: 'var(--sats)'}
  ]);
}

function secchi(modo) {
  const out = [], visti = new Set(), da = dataInizio();
  const GIORNO = 86400000;
  for (let t = new Date(da + 'T00:00:00Z').getTime(); t <= Date.now(); t += GIORNO) {
    const k = chiave(new Date(t).toISOString().slice(0, 10), modo);
    if (!visti.has(k)) { visti.add(k); out.push(k); }
  }
  return out;
}

function chiave(g, modo) {
  if (modo === 'giorno') return g;
  if (modo === 'mese') return g.slice(0, 7);
  const d = new Date(g + 'T00:00:00Z');
  const lun = new Date(d.getTime() - ((d.getUTCDay() + 6) % 7) * 86400000);
  return lun.toISOString().slice(0, 10);
}

function aggregaIscritti(modo, ks) {
  const m = {}, da = dataInizio();
  for (const [data, tg, nostr] of D.iscritti) {
    if (data < da) continue;
    const k = chiave(data, modo);
    if (!m[k]) m[k] = [0, 0];
    m[k][0] += tg; m[k][1] += nostr;
  }
  return m;
}

function aggregaFee(modo, ks) {
  const m = {}, da = dataInizio(), L = D.lnd || {};
  if (!L.fee_history) return m;
  for (const [data, fee] of L.fee_history) {
    if (data < da) continue;
    const k = chiave(data, modo);
    if (!m[k]) m[k] = [0];
    m[k][0] += fee;
  }
  return m;
}

function aggregaVolume(modo, ks) {
  const m = {}, da = dataInizio();
  for (const [data, ordini, sats] of D.volume) {
    if (data < da) continue;
    const k = chiave(data, modo);
    if (!m[k]) m[k] = [0];
    m[k][0] += sats;
  }
  return m;
}

function grafico(box, ks, modo, valori, serie) {
  if (!box) return;
  const W = Math.max(280, Math.round(box.parentElement.clientWidth || 400));
  const H = 200, SX = 40, DX = 8, ALTO = 12, BASSO = 20;

  const max = Math.max(1, ...ks.map(k => (valori[k] || [0])[0]));
  const y = v => ALTO + (H - ALTO - BASSO) * (1 - v / max);
  const x = (i, n) => SX + (i / Math.max(1, n - 1)) * (W - SX - DX);

  let svg = '';

  svg += `<line x1="${SX}" x2="${W - DX}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;

  for (let i = 0; i < ks.length; i++) {
    const xx = x(i, ks.length);
    svg += `<rect class="hit" data-i="${i}" x="${xx - 20}" y="${ALTO}" width="40" height="${H - ALTO - BASSO}" fill="transparent" cursor="pointer"/>`;
  }

  const n = ks.length;
  for (let i = 0; i < n; i++) {
    const v = (valori[ks[i]] || [0])[0];
    const xx = x(i, n);
    const yy = y(v);
    const h = Math.max(2, y(0) - yy);
    svg += `<rect x="${xx - 3}" y="${yy}" width="6" height="${h}" fill="var(--sats)" rx="2"/>`;
  }

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg">${svg}</svg><div class="tooltip"></div>`;

  const s = box.querySelector('svg');
  const tip = box.querySelector('.tooltip');
  s.addEventListener('pointermove', e => {
    const r = e.target.closest('.hit');
    if (!r) return;
    const i = +r.dataset.i;
    const v = valori[ks[i]] || [0];
    tip.innerHTML = `${etichetta(ks[i], modo)}<br>${fmt(v[0])} ${v[1] ? ` · ${fmt(v[1])}` : ''}`;
    const k = s.getBoundingClientRect();
    tip.style.left = (x(i, n) / W * k.width) + 'px';
    tip.style.top = (y(v[0]) / H * k.height - 10) + 'px';
    tip.classList.add('on');
  });
  s.addEventListener('pointerleave', () => tip.classList.remove('on'));
}

function etichetta(k, modo) {
  if (modo === 'mese') {
    const [a, m] = k.split('-');
    return new Date(Date.UTC(+a, +m - 1, 1)).toLocaleDateString('it-IT', {month:'short', year:'2-digit'});
  }
  return new Date(k + 'T00:00:00Z').toLocaleDateString('it-IT', {day:'numeric', month:'short'});
}

addEventListener('resize', () => D && disegnaGrafici());
carica();
</script>
</body>
</html>
